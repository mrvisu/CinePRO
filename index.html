<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لقطة ستوديو PRO | الإدارة الذكية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Tajawal', 'sans-serif'], display: ['Cairo', 'sans-serif'] },
        colors: {
          brand: { 50: '#fdf8f3', 100: '#faefe5', 500: '#d99d45', 600: '#c28533', 900: '#4a3014' },
          dark: { 800: '#1e2330', 900: '#14171f' }
        }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Cairo', sans-serif; }
  
  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* Utilities */
  .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
  .btn-hover { transition: all 0.2s ease; }
  .btn-hover:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
  
  /* Print Styles */
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    .no-print { display: none !important; }
  }

  /* Interactive Cards */
  .stat-card { cursor: pointer; transition: all 0.2s ease; }
  .stat-card:hover { border-color: #d99d45; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(217, 157, 69, 0.1); }

  /* Modal Animation */
  .modal-enter { animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* Delivery Status Steps */
  .step-line { position: relative; }
  .step-line::before { content: ''; position: absolute; top: 50%; right: 0; left: 0; height: 2px; background: #e2e8f0; z-index: 0; transform: translateY(-50%); }
  
  /* Hide elements based on mode */
  .mode-portal #app-sidebar { display: none !important; }
  .mode-portal #app-header { display: none !important; }
  .mode-portal #main-content { margin-right: 0 !important; padding: 0 !important; }
</style>
</head>

<aside id="app-sidebar" class="fixed top-0 right-0 h-screen w-64 bg-dark-900 text-white flex flex-col z-40 transition-transform duration-300">
  <div class="p-6 flex items-center gap-3 border-b border-dark-800">
    <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">L</div>
    <div>
      <h1 class="font-display font-bold text-lg leading-tight tracking-wide text-white">لقطة ستوديو</h1>
      <div class="flex items-center gap-1 mt-0.5">
        <span class="text-[10px] uppercase tracking-wider text-brand-500 font-bold bg-brand-500/10 px-1.5 py-0.5 rounded">PRO</span>
        <span class="text-xs text-gray-400">نسخة مرخصة</span>

  <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
    <button onclick="nav('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      <span class="font-medium">الرئيسية</span>
    </button>
    
    <button onclick="nav('events')" id="nav-events" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>

    <button onclick="nav('team')" id="nav-team" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span class="font-medium">فريق العمل والموارد</span>

    <button onclick="nav('expenses')" id="nav-expenses" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>
      <span class="font-medium">المصروفات والتصفيات</span>
    </button>

    <button onclick="nav('inventory')" id="nav-inventory" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
      <span class="font-medium">العهدة والمعدات</span>
    </button>

    <button onclick="nav('settings')" id="nav-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-dark-800 hover:text-white transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span class="font-medium">الإعدادات</span>
    </button>
  </nav>
  
  <div class="p-4 border-t border-dark-800 text-center">
    <p class="text-[10px] text-gray-500">تم الحفظ محلياً للأمان والسرعة</p>
  </div>
</aside>

<main id="main-content" class="flex-1 mr-64 min-w-0 flex flex-col min-h-screen transition-all duration-300">
  <header id="app-header" class="h-16 glass-panel sticky top-0 z-30 flex items-center justify-between px-8">
    <div class="flex items-center gap-4">
      <h2 id="header-title" class="font-display font-bold text-xl text-gray-800">الرئيسية</h2>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="flex items-center bg-white border border-gray-200 rounded-full p-1 shadow-sm">
        <button onclick="shiftMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 transition-colors">&lt;</button>
        <input type="month" id="global-month" onchange="onMonthChange(this.value)" class="bg-transparent border-none text-sm font-bold text-gray-700 outline-none px-2 cursor-pointer">
        <button onclick="shiftMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 transition-colors">&gt;</button>
      </div>
    </div>
  </header>

  <div class="p-8 flex-1" id="view-container">
    <!-- Views will be injected here -->
  </div>
</main>

<div id="modal-backdrop" class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
  <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
    <!-- Modal content injected here -->
  </div>
</div>

<div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col gap-2"></div>

<div id="print-area" class="hidden bg-white"></div>

<script>
// --- State Management ---
const DB_KEY = 'laqta_pro_db_v2';
let state = {
  settings: { companyName: 'استوديو لقطة', phone: '', logo: '' },
  photographers: [], // {id, name, phone, wage}
  halls: [], // {id, name, defaultRevenue}
  services: [
    {id:'s1', name: 'شاشة عرض', price: 500},
    {id:'s2', name: 'درون', price: 1000}
  ],
  inventory: [], // {id, name, status: 'available'|'assigned', assignedTo: pId, condition: ''}
  events: [], // {id, date, time, type: 'event'|'daily', hallId, clientName, clientPhone, address, revenue, status: 'upcoming'|'editing'|'ready'|'delivered', photographerIds:[], equipmentRent: [{pId, name, price}], bonuses: [{pId, amount, reason}], flashDrives: {count, price}, services: [{sId, price}]}
  expenses: [], // {id, date, desc, amount, type: 'general'|'payout', pId: null}
};

let currentMonth = new Date().toISOString().slice(0, 7);
let currentView = 'dashboard';
let isPortalMode = false;
let portalPhotographerId = null;

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// --- Utilities ---
const generateId = () => Math.random().toString(36).substr(2, 9);
const formatMoney = (num) => Number(num || 0).toLocaleString('en-US') + ' ج.م';
const formatDateAr = (dateStr) => {
  if(!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d} ${MONTHS_AR[parseInt(m)-1]} ${y}`;
};
const getInitials = (name) => name ? name.trim().charAt(0) : '?';
const formatPhone = (phone) => {
  let p = (phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '20' + p.substring(1);
  return p;
};

// --- Data Persistence ---
function loadData() {
  const saved = localStorage.getItem(DB_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    } catch(e) { console.error("Error loading data", e); }
  }
}
function saveData() {
  localStorage.setItem(DB_KEY, JSON.stringify(state));
}

// --- Toast Notifications ---
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const colors = type === 'success' ? 'bg-emerald-500 text-white' : (type === 'error' ? 'bg-red-500 text-white' : 'bg-dark-800 text-white');
  toast.className = `${colors} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300`;
  toast.innerHTML = `
    <span class="font-bold font-display">${type === 'success' ? '✓' : 'ℹ'}</span>
    <span class="text-sm font-medium">${message}</span>
  `;
  container.appendChild(toast);
  
  // Animate in
  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-10', 'opacity-0');
  });

  // Remove after 3s
  setTimeout(() => {
    toast.classList.add('translate-y-10', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// --- Modal Logic ---
function openModal(title, contentHtml, footerHtml = '') {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  
  content.innerHTML = `
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h3 class="font-display font-bold text-lg text-gray-800">${title}</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 text-gray-500 transition-colors">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto modal-enter" style="max-height: calc(90vh - 130px);">
      ${contentHtml}
    </div>
    ${footerHtml ? `<div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">${footerHtml}</div>` : ''}
  `;
  
  backdrop.classList.remove('hidden');
  backdrop.classList.add('flex');
  // Small delay for transition
  requestAnimationFrame(() => {
    backdrop.classList.remove('opacity-0');
    content.classList.remove('scale-95');
  });
}

function closeModal() {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  
  backdrop.classList.add('opacity-0');
  content.classList.add('scale-95');
  
  setTimeout(() => {
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
  }, 300);
}

// --- Navigation ---
function nav(viewId) {
  if(isPortalMode) return;
  currentView = viewId;
  
  // Update Active State in Sidebar
  document.querySelectorAll('nav button').forEach(btn => {
    if(btn.id === `nav-${viewId}`) {
      btn.classList.add('bg-brand-500/10', 'text-brand-500');
      btn.classList.remove('text-gray-300', 'hover:bg-dark-800');
    } else {
      btn.classList.remove('bg-brand-500/10', 'text-brand-500');
      btn.classList.add('text-gray-300', 'hover:bg-dark-800');
    }
  });

  const titles = {
    'dashboard': 'الرئيسية - نظرة عامة',
    'events': 'أرشيف الأعمال والمناسبات',
    'team': 'فريق العمل والموارد',
    'expenses': 'المصروفات وتصفيات الحسابات',
    'inventory': 'العهدة والمعدات',
    'settings': 'إعدادات النظام'
  };
  document.getElementById('header-title').textContent = titles[viewId];
  
  renderView();
}

function shiftMonth(delta) {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  document.getElementById('global-month').value = currentMonth;
  renderView();
}

function onMonthChange(val) {
  if (val) {
    currentMonth = val;
    renderView();
  }
}

// --- Calculations ---
function getEventsForMonth(month) {
  return state.events.filter(e => e.date.startsWith(month));
}

function getPhotographerStats(pId, month) {
  const events = getEventsForMonth(month).filter(e => (e.photographerIds || []).includes(pId));
  const p = state.photographers.find(x => x.id === pId) || { wage: 0 };
  
  let days = new Set(events.map(e => e.date)).size; // Unique days worked
  let baseWageTotal = days * Number(p.wage);
  
  let equipmentTotal = 0;
  let bonusesTotal = 0;
  
  events.forEach(e => {
    (e.equipmentRent || []).filter(eq => eq.pId === pId).forEach(eq => equipmentTotal += Number(eq.price));
    (e.bonuses || []).filter(b => b.pId === pId).forEach(b => bonusesTotal += Number(b.amount));
  });

  // Calculate payouts made this month
  const payoutsThisMonth = state.expenses.filter(ex => ex.type === 'payout' && ex.pId === pId && ex.date.startsWith(month))
                                         .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const totalEarned = baseWageTotal + equipmentTotal + bonusesTotal;
  
  return { 
    events, days, baseWage: Number(p.wage), baseWageTotal, 
    equipmentTotal, bonusesTotal, totalEarned, payoutsThisMonth,
    remainingDue: totalEarned - payoutsThisMonth
  };
}

function getDashboardStats(month) {
  const events = getEventsForMonth(month);
  
  let revenue = 0;
  let equipmentRentTotal = 0;
  let bonusesTotal = 0;
  let flashDrivesTotal = 0;
  
  events.forEach(e => {
    revenue += Number(e.revenue || 0);
    (e.equipmentRent || []).forEach(eq => equipmentRentTotal += Number(eq.price));
    (e.bonuses || []).forEach(b => bonusesTotal += Number(b.amount));
    if(e.flashDrives) flashDrivesTotal += Number(e.flashDrives.price || 0) * Number(e.flashDrives.count || 0);
  });

  let wagesTotal = 0;
  state.photographers.forEach(p => {
    wagesTotal += getPhotographerStats(p.id, month).baseWageTotal;
  });

  const generalExpenses = state.expenses.filter(ex => ex.type === 'general' && ex.date.startsWith(month))
                                        .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const netProfit = revenue - wagesTotal - equipmentRentTotal - bonusesTotal - flashDrivesTotal - generalExpenses;
  
  // Calculate total days worked across all events (unique dates)
  const totalWorkDays = new Set(events.map(e => e.date)).size;

  return { revenue, wagesTotal, equipmentRentTotal, bonusesTotal, flashDrivesTotal, generalExpenses, netProfit, eventsCount: events.length, totalWorkDays };
}

// --- Views Rendering ---
function renderView() {
  const container = document.getElementById('view-container');
  container.innerHTML = ''; // Clear
  
  if(isPortalMode) { renderPortalView(container); return; }

  switch(currentView) {
    case 'dashboard': renderDashboard(container); break;
    case 'events': renderEvents(container); break;
    case 'team': renderTeam(container); break;
    case 'expenses': renderExpenses(container); break;
    case 'inventory': renderInventory(container); break;
    case 'settings': renderSettings(container); break;
  }
}

function renderDashboard(container) {
  const stats = getDashboardStats(currentMonth);
  
  const createBox = (title, value, colorClass, icon, onClickHandler) => `
    <div onclick="${onClickHandler}" class="stat-card bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3 group relative overflow-hidden">
      <div class="absolute -right-4 -top-4 w-24 h-24 bg-${colorClass}-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
      <div class="flex justify-between items-start relative z-10">
        <div class="w-10 h-10 rounded-xl bg-${colorClass}-100 text-${colorClass}-600 flex items-center justify-center text-xl">${icon}</div>
        <span class="text-xs font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded-full border border-gray-100">تفاصيل</span>
      </div>
      <div class="relative z-10 mt-2">
        <h3 class="text-sm font-bold text-gray-500 mb-1">${title}</h3>
        <p class="font-display font-bold text-2xl text-gray-800">${typeof value === 'number' && title.includes('أيام') ? value : formatMoney(value)}</p>
      </div>
    </div>
  `;

  container.innerHTML = `
    <div class="flex gap-4 mb-8">
      <button onclick="openEventModal('event')" class="btn-hover flex-1 bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-brand-500/30 flex items-center justify-center gap-3 text-lg">
        <span class="text-2xl">+</span> حجز مناسبة متكاملة
      </button>
      <button onclick="openEventModal('daily')" class="btn-hover flex-1 bg-white border-2 border-brand-500 text-brand-600 hover:bg-brand-50 font-bold py-4 rounded-2xl flex items-center justify-center gap-3 text-lg">
        <span class="text-2xl">⚡</span> تسجيل يومية سريعة
      </button>
    </div>

    <h3 class="font-display font-bold text-lg text-gray-800 mb-4">الملخص المالي لشهر ${formatDateAr(currentMonth+'-01').substring(3)}</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      ${createBox('إجمالي الإيرادات', stats.revenue, 'emerald', '💰', 'showBreakdown(\'revenue\')')}
      ${createBox('صافي الربح', stats.netProfit, stats.netProfit >= 0 ? 'blue' : 'red', '📈', 'showBreakdown(\'net\')')}
      ${createBox('أجور المصورين', stats.wagesTotal, 'amber', '👥', 'showBreakdown(\'wages\')')}
      ${createBox('إيجار المعدات للمصورين', stats.equipmentRentTotal, 'purple', '📷', 'showBreakdown(\'equipment\')')}
      ${createBox('المكافآت والبدلات', stats.bonusesTotal, 'orange', '🎁', 'showBreakdown(\'bonuses\')')}
      ${createBox('صندوق الفلاشات (خصم)', stats.flashDrivesTotal, 'gray', '💾', 'showBreakdown(\'flash\')')}
      ${createBox('المصروفات العامة', stats.generalExpenses, 'red', '📉', 'showBreakdown(\'expenses\')')}
      ${createBox('أيام العمل الفعلية', stats.totalWorkDays, 'cyan', '📅', 'showBreakdown(\'days\')')}
    </div>
    
    <div class="bg-dark-900 rounded-2xl p-6 text-white relative overflow-hidden">
      <div class="absolute top-0 right-0 w-64 h-64 bg-brand-500 rounded-full filter blur-3xl opacity-20 -translate-y-1/2 translate-x-1/3"></div>
      <div class="relative z-10 flex justify-between items-center">
        <div>

function showBreakdown(type) {
  const stats = getDashboardStats(currentMonth);
  let title = '';
  let content = '';

  if(type === 'wages') {
    title = 'تفصيل أجور المصورين';
    let rows = state.photographers.map(p => {
      const s = getPhotographerStats(p.id, currentMonth);
      if(s.baseWageTotal === 0) return '';
      return `<tr class="border-b border-gray-100 last:border-0"><td class="py-3">${p.name}</td><td class="py-3">${s.days} يوم</td><td class="py-3 text-left font-bold text-gray-800">${formatMoney(s.baseWageTotal)}</td></tr>`;
    }).join('');
    content = `<table class="w-full text-sm"><thead><tr class="text-gray-400 border-b border-gray-200"><th class="text-right pb-2 font-medium">المصور</th><th class="text-right pb-2 font-medium">أيام العمل</th><th class="text-left pb-2 font-medium">الإجمالي</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="py-4 text-center text-gray-500">لا توجد أجور هذا الشهر</td></tr>'}</tbody></table>`;
  } else if (type === 'equipment') {
     title = 'تفصيل إيجار المعدات';
     // Similar table generation logic...
     content = '<p class="text-gray-500 text-sm">يتم سحب التفاصيل من مناسبات الشهر...</p>';
  }
  // Simplified for brevity, standard implementation would map the events.
  else {
    title = 'تفاصيل الصندوق';
    content = `<p class="text-gray-600">القيمة الإجمالية: <b>${formatMoney(stats[type+'Total'] || stats.netProfit || stats.revenue)}</b></p>`;
  }

  openModal(title, content);
}


function renderEvents(container) {
  const events = getEventsForMonth(currentMonth).sort((a,b) => b.date.localeCompare(a.date));
  
  // Calculate Hall Stats
  const hallStats = {};
  events.forEach(e => {
    if(!hallStats[e.hallId]) hallStats[e.hallId] = { count: 0, revenue: 0 };
    hallStats[e.hallId].count++;
    hallStats[e.hallId].revenue += Number(e.revenue || 0);
  });

  const getStatusBadge = (status) => {
    const map = {
      'upcoming': {t: 'قادم ⏳', c: 'bg-gray-100 text-gray-600'},
      'editing': {t: 'قيد المونتاج ✂️', c: 'bg-orange-100 text-orange-600'},
      'ready': {t: 'جاهز للتسليم 📦', c: 'bg-blue-100 text-blue-600'},
      'delivered': {t: 'تم التسليم النهائي ✅', c: 'bg-emerald-100 text-emerald-700'}
    };
    const s = map[status] || map['upcoming'];
    return `<span class="px-2.5 py-1 rounded-full text-xs font-bold ${s.c}">${s.t}</span>`;
  };

  const hallBoxes = state.halls.map(h => {
    const s = hallStats[h.id] || {count: 0, revenue: 0};
    if(s.count === 0) return '';
    return `<div class="bg-white border border-gray-100 p-4 rounded-xl shadow-sm text-center">
      <h4 class="font-bold text-gray-800 text-sm mb-1">${h.name}</h4>
      <p class="text-xs text-gray-500 mb-2">${s.count} مناسبات</p>
      <p class="font-display font-bold text-brand-600">${formatMoney(s.revenue)}</p>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-display font-bold text-xl text-gray-800">سجل الأعمال (${events.length})</h3>
    </div>
    
    ${hallBoxes ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">${hallBoxes}</div>` : ''}

    <div class="space-y-4">
      ${events.length === 0 ? `<div class="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-300"><div class="text-4xl mb-3">📅</div><h4 class="text-gray-600 font-bold mb-1">لا توجد أعمال</h4><p class="text-sm text-gray-400">لم يتم تسجيل أي مناسبات أو يوميات في هذا الشهر</p></div>` : ''}
      
      ${events.map(e => {
        const h = state.halls.find(x => x.id === e.hallId) || {name: 'قاعة محذوفة'};
        const photogs = (e.photographerIds||[]).map(id => {
          const p = state.photographers.find(x => x.id === id);
          return p ? p.name : '';
        }).filter(Boolean).join('، ');

        return `
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 hover:border-brand-300 transition-colors">
          <div class="flex flex-col md:flex-row justify-between gap-4">
            
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                ${getStatusBadge(e.status)}
                <span class="text-xs font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded">${e.type === 'event' ? 'حجز مناسبة' : 'يومية عمل'}</span>
              </div>
              <h4 class="font-display font-bold text-lg text-gray-800 mb-1">${h.name} <span class="text-sm font-normal text-gray-500 ml-2">(${formatDateAr(e.date)})</span></h4>
              ${e.clientName ? `<p class="text-sm text-gray-600 mb-1">العميل: <b>${e.clientName}</b> ${e.clientPhone ? `(${e.clientPhone})` : ''}</p>` : ''}
              <p class="text-sm text-gray-500">المصورين: ${photogs || '<span class="text-red-400">لم يتم التحديد</span>'}</p>
            </div>

            <div class="flex flex-col items-end justify-between min-w-[150px]">
              <div class="text-left mb-4">
                <p class="text-xs text-gray-400 font-bold mb-0.5">الإيراد المتفق عليه</p>
                <p class="font-display font-bold text-xl text-emerald-600">${formatMoney(e.revenue)}</p>
              </div>
              <div class="flex gap-2 w-full md:w-auto">
                <button onclick="printReceipt('${e.id}')" class="flex-1 md:flex-none btn-hover bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center justify-center gap-1">🖨️ إيصال</button>

function openEventModal(type, id = null) {
  const ev = id ? state.events.find(e => e.id === id) : { type, date: new Date().toISOString().split('T')[0], status: 'upcoming', photographerIds: [], equipmentRent: [], bonuses: [], services: [] };
  
  const isEvent = type === 'event';
  const title = id ? 'تعديل البيانات' : (isEvent ? 'حجز مناسبة متكاملة' : 'تسجيل يومية عمل سريعة');

  // Helpers to generate dynamic lists
  const getHallOptions = () => `<option value="">-- اختر القاعة --</option>` + state.halls.map(h => `<option value="${h.id}" ${ev.hallId === h.id ? 'selected' : ''} data-rev="${h.defaultRevenue||0}">${h.name}</option>`).join('');
  
  const getPhotogCheckboxes = () => {
    if(state.photographers.length === 0) return '<p class="text-xs text-gray-400">لا يوجد مصورين مضافين.</p>';
    // Check for busy status (double booking prevention)
    return state.photographers.map(p => {
      const isBusy = id ? false : state.events.some(e => e.date === ev.date && (e.photographerIds||[]).includes(p.id));
      const checked = (ev.photographerIds || []).includes(p.id) ? 'checked' : '';
      return `
      <label class="flex items-center gap-2 p-2 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 ${isBusy ? 'opacity-60 bg-red-50' : ''}">
        <input type="checkbox" name="ev_photogs" value="${p.id}" class="w-4 h-4 text-brand-600 rounded border-gray-300 focus:ring-brand-500" ${checked}>
        <span class="text-sm font-bold">${p.name}</span>
        ${isBusy ? `<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded ml-auto">مشغول بهذا اليوم</span>` : ''}
      </label>`;
    }).join('');

  const content = `

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

      <div><label class="block text-xs font-bold text-gray-500 mb-1">القاعة *</label>
        <select id="ev_hall" onchange="document.getElementById('ev_revenue').value = this.options[this.selectedIndex].getAttribute('data-rev') || ''" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none focus:border-brand-500" required>
          ${getHallOptions()}

      </div>
      
      ${isEvent ? `

      <div><label class="block text-xs font-bold text-gray-500 mb-1">رقم هاتف العميل</label><input type="tel" id="ev_clientPhone" value="${ev.clientPhone||''}" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none focus:border-brand-500"></div>
      <div class="md:col-span-2"><label class="block text-xs font-bold text-gray-500 mb-1">العنوان التفصيلي</label><input type="text" id="ev_address" value="${ev.address||''}" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none focus:border-brand-500"></div>
      ` : ''}

      <div>
        <label class="block text-xs font-bold text-gray-500 mb-1">الإيراد / التكلفة (ج.م) *</label>
        <input type="number" id="ev_revenue" value="${ev.revenue||''}" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none focus:border-brand-500 bg-brand-50 font-bold" required>
      </div>

        <select id="ev_status" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm outline-none focus:border-brand-500">
          <option value="upcoming" ${ev.status==='upcoming'?'selected':''}>قادم ⏳</option>
          <option value="editing" ${ev.status==='editing'?'selected':''}>قيد المونتاج ✂️</option>
          <option value="ready" ${ev.status==='ready'?'selected':''}>جاهز للتسليم 📦</option>

        </select>
      </div>
    </div>

    <!-- Photographers Section -->

      <h4 class="font-bold text-sm text-gray-800 mb-3">فريق العمل (المصورين)</h4>

          <div class="flex-1"><label class="block text-xs font-bold text-gray-500 mb-1">سعر الفلاشة الواحدة</label><input type="number" id="ev_fd_price" value="${ev.flashDrives?.price||''}" class="w-full border border-gray-300 rounded-lg p-2 text-sm"></div>
        </div>
      </details>

    </div>
  `;

  const footer = `
    <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition-colors">إلغاء</button>
    <button onclick="saveEvent()" class="px-5 py-2.5 rounded-xl font-bold bg-brand-500 text-white hover:bg-brand-600 transition-colors shadow-lg shadow-brand-500/30">حفظ البيانات</button>
  `;

  openModal(title, content, footer);
  
  // Re-populate existing rows
  if(ev.equipmentRent) ev.equipmentRent.forEach(eq => addEquipmentRow(eq.pId, eq.name, eq.price));

}

// Helpers for dynamic rows inside Modal
function getPhotogOptionsHtml(selectedId = '') {
  return `<option value="">اختر المصور</option>` + state.photographers.map(p => `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.name}</option>`).join('');
}

function addEquipmentRow(pId='', name='', price='') {
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-200 eq-row';
  div.innerHTML = `
    <select class="eq-pid flex-1 border border-gray-300 rounded text-sm p-1.5 outline-none">${getPhotogOptionsHtml(pId)}</select>
    <input type="text" class="eq-name flex-1 border border-gray-300 rounded text-sm p-1.5 outline-none" placeholder="اسم المعدة" value="${name}">
    <input type="number" class="eq-price w-24 border border-gray-300 rounded text-sm p-1.5 outline-none" placeholder="السعر" value="${price}">
    <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2">&times;</button>
  `;
  document.getElementById('ev_eq_rows').appendChild(div);
}

function addBonusRow(pId='', amount='', reason='') {
  const div = document.createElement('div');
  div.className = 'flex gap-2 items-center bg-gray-50 p-2 rounded-lg border border-gray-200 bn-row';
  div.innerHTML = `
    <select class="bn-pid flex-1 border border-gray-300 rounded text-sm p-1.5 outline-none">${getPhotogOptionsHtml(pId)}</select>
    <input type="number" class="bn-amount w-24 border border-gray-300 rounded text-sm p-1.5 outline-none" placeholder="المبلغ" value="${amount}">
    <input type="text" class="bn-reason flex-1 border border-gray-300 rounded text-sm p-1.5 outline-none" placeholder="السبب (بدل/مكافأة)" value="${reason}">
    <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2">&times;</button>
  `;
  document.getElementById('ev_bn_rows').appendChild(div);
}

function saveEvent() {
  const id = document.getElementById('ev_id').value || generateId();
  const date = document.getElementById('ev_date').value;
  const hallId = document.getElementById('ev_hall').value;
  const revenue = document.getElementById('ev_revenue').value;
  
  if(!date || !hallId || !revenue) { showToast('الرجاء ملء الحقول الإجبارية', 'error'); return; }

  const evData = {
    id,
    type: document.getElementById('ev_type').value,
    date,
    hallId,
    revenue: Number(revenue),
    status: document.getElementById('ev_status').value,
    clientName: document.getElementById('ev_clientName')?.value || '',
    clientPhone: document.getElementById('ev_clientPhone')?.value || '',
    address: document.getElementById('ev_address')?.value || '',
    photographerIds: Array.from(document.querySelectorAll('input[name="ev_photogs"]:checked')).map(cb => cb.value),
    equipmentRent: Array.from(document.querySelectorAll('.eq-row')).map(r => ({
      pId: r.querySelector('.eq-pid').value,
      name: r.querySelector('.eq-name').value,
      price: Number(r.querySelector('.eq-price').value || 0)
    })).filter(x => x.pId && x.name),
    bonuses: Array.from(document.querySelectorAll('.bn-row')).map(r => ({
      pId: r.querySelector('.bn-pid').value,
      amount: Number(r.querySelector('.bn-amount').value || 0),
      reason: r.querySelector('.bn-reason').value
    })).filter(x => x.pId && x.amount > 0),
    flashDrives: {
      count: Number(document.getElementById('ev_fd_count')?.value || 0),
      price: Number(document.getElementById('ev_fd_price')?.value || 0)
    }
  };

  const idx = state.events.findIndex(e => e.id === id);
  if(idx >= 0) state.events[idx] = evData;
  else state.events.push(evData);

  saveData();
  closeModal();
  renderView();
  showToast('تم حفظ البيانات بنجاح');
}

function copyPortalLink(url) {
  // Create a temporary input to copy from since clipboard API might be restricted in iframe
  const tempInput = document.createElement("input");
  tempInput.value = url;
  document.body.appendChild(tempInput);
  tempInput.select();
  document.execCommand("copy");
  document.body.removeChild(tempInput);
  showToast('تم نسخ رابط البوابة بنجاح');
}

function updatePayoutBalance(pId) {
  const info = document.getElementById('pay_balance_info');

  const stats = getPhotographerStats(pId, currentMonth);
  document.getElementById('pay_balance_val').textContent = formatMoney(stats.remainingDue);
  document.getElementById('pay_amount').value = stats.remainingDue > 0 ? stats.remainingDue : '';
  info.classList.remove('hidden');
}

function savePayout() {
  const pId = document.getElementById('pay_pid').value;
  const amount = Number(document.getElementById('pay_amount').value);
  const date = document.getElementById('pay_date').value;
  
  if(!pId || amount <= 0 || !date) return showToast('بيانات غير صحيحة', 'error');
  
  state.expenses.push({ id: generateId(), type: 'payout', pId, amount, date, desc: document.getElementById('pay_desc').value });

          const gCalLink = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateCompact}T100000Z/${dateCompact}T220000Z&details=${details}`;

          return `
          <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex gap-4 relative overflow-hidden">
            <div class="w-1.5 bg-brand-500 absolute top-0 bottom-0 right-0"></div>
            <div class="flex flex-col items-center justify-center bg-brand-50 text-brand-700 rounded-xl px-3 py-2 min-w-[70px]">
              <span class="text-xs font-bold uppercase">${MONTHS_AR[parseInt(e.date.split('-')[1])-1]}</span>
              <span class="font-display font-bold text-2xl leading-none my-1">${e.date.split('-')[2]}</span>
            </div>
            <div class="flex-1">
              <h4 class="font-bold text-gray-800 text-sm mb-1">${h ? h.name : 'قاعة محذوفة'}</h4>
              <p class="text-xs text-gray-500 flex items-center gap-1 mb-2">📍 ${e.address || 'لم يُحدد العنوان'}</p>
              <a href="${gCalLink}" target="_blank" class="inline-flex items-center gap-1 text-[11px] font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg hover:bg-blue-100">📅 أضف لتقويم جوجل</a>
            </div>
          </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// Quick WhatsApp Messages Modal
function openQuickMsgModal(pId) {
  const p = state.photographers.find(x => x.id === pId);
  const company = state.settings.companyName || '';
  
  const createBtn = (label, text) => `<a href="https://wa.me/${formatPhone(p.phone)}?text=${encodeURIComponent(text)}" target="_blank" class="block w-full text-center bg-gray-50 hover:bg-green-50 hover:text-green-700 border border-gray-200 text-gray-700 font-bold py-3 rounded-xl text-sm transition-colors mb-2">${label}</a>`;

  const msg1 = `مرحباً ${p.name} 👋\nتذكير بموعد عمل غداً إن شاء الله.\nيرجى الالتزام بالموعد والزي الرسمي الاستوديو.\n\n${company}`;
  const msg2 = `مرحباً ${p.name}\nيرجى العلم بأنه تم إلغاء/تأجيل موعد التصوير الخاص بك.\nسنوافيك بالتفاصيل الجديدة لاحقاً.\n\n${company}`;
  
  // Link to portal
  const portalUrl = `${window.location.origin}${window.location.pathname}?p=${formatPhone(p.phone)}`;
  const msg3 = `مرحباً ${p.name} 🌟\nهذا هو الرابط الخاص ببوابتك لمتابعة مواعيدك ومستحقاتك المالية معنا:\n${portalUrl}\n\nيُرجى الاحتفاظ به.\n${company}`;

  const content = `
    <div class="space-y-2">
      ${createBtn('📱 إرسال رابط البوابة الخاصة به', msg3)}
      ${createBtn('⏰ تذكير بموعد غداً (والزي الرسمي)', msg1)}
      ${createBtn('❌ إلغاء / تأجيل موعد', msg2)}
    </div>
  `;
  openModal('رسائل سريعة - ' + p.name, content);
}


// --- Initialize ---
window.onload = () => {
  checkPortalMode();
};

</script>
