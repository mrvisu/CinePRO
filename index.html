<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لقطة برو | الإدارة الذكية للاستوديوهات</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Alexandria', 'sans-serif'] },
        colors: {
          app: {
            bg: '#09090b',       // Zinc 950
            surface: '#18181b',  // Zinc 900
            card: '#1f2024',
            border: '#27272a',   // Zinc 800
            hover: '#27272a',
            text: '#e4e4e7',
            muted: '#a1a1aa'
          },
          primary: {
            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' // Electric Blue
          },
          accent: {
            500: '#8b5cf6' // Violet
          }
        },
        boxShadow: {
          'neon': '0 0 20px rgba(59, 130, 246, 0.3)',
          'card': '0 4px 20px rgba(0, 0, 0, 0.4)'
        }
      }
    }
  }
</script>

<style>
  body { 
    background-color: #09090b; 
    color: #e4e4e7; 
    -webkit-font-smoothing: antialiased; 
    background-image: 
      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #52525b; }

  /* UI Elements */
  .glass-card {
    background: rgba(31, 32, 36, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.3);
  }

  .interactive-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .interactive-card:hover {
    transform: translateY(-3px);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
  }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    transition: all 0.2s;
  }
  .btn-primary:hover { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(1px); }

  /* Inputs */
  input, select, textarea {
    background-color: rgba(24, 24, 27, 0.8) !important;
    border: 1px solid #27272a !important;
    color: #e4e4e7 !important;
    transition: all 0.2s;
    color-scheme: dark;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #3b82f6 !important;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
    outline: none !important;
  }

  /* Animations */
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-fade-in { animation: fadeIn 0.3s ease forwards; }

  /* Sidebar transitions */
  #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  
  /* Portal Mode (Mobile First) */
  .mode-portal body { background-image: none; background-color: #000; }
  .mode-portal #sidebar, .mode-portal #topbar { display: none !important; }
  .mode-portal #main-content { margin: 0 !important; padding: 0 !important; width: 100%; }

  /* Mobile tweaks */
  @media (max-width: 768px) {
    #main-content { margin-right: 0 !important; }
  }
</style>
</head>
<body id="body-root" class="relative">

<!-- Auth / Login View -->
<div id="auth-view" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-app-bg bg-opacity-90 backdrop-blur-sm">
  <div class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden animate-slide-up border border-app-border">
    <div class="absolute top-0 right-0 w-48 h-48 bg-primary-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-32 h-32 bg-accent-500/10 rounded-full blur-3xl"></div>
    
    <div class="text-center mb-8 relative z-10">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-500 to-accent-500 mx-auto flex items-center justify-center text-white font-bold text-4xl shadow-neon mb-5 transform hover:scale-105 transition-transform">L</div>
      <h2 class="text-3xl font-bold text-white mb-2 tracking-tight">لقطة برو</h2>
      <p class="text-app-muted text-sm">نظام الإدارة الذكية للاستوديوهات المتقدمة</p>
    </div>
    
    <form onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
      <div>
        <label class="block text-xs text-app-muted mb-2 font-medium">البريد الإلكتروني للإستوديو</label>
        <input type="email" id="login_email" class="w-full rounded-xl p-3.5 text-sm" placeholder="studio@example.com" required dir="ltr">
      </div>
      <div>
        <label class="block text-xs text-app-muted mb-2 font-medium">كلمة المرور السرية</label>
        <input type="password" id="login_password" class="w-full rounded-xl p-3.5 text-sm tracking-widest font-mono" placeholder="••••••••" required dir="ltr">
      </div>
      <button type="submit" class="w-full btn-primary py-4 rounded-xl font-bold text-base shadow-neon flex items-center justify-center gap-2 mt-2">
        <span>تسجيل الدخول للنظام</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
      </button>
    </form>
  </div>
</div>

<!-- Super Admin View -->
<div id="admin-view" class="fixed inset-0 z-[150] bg-app-bg hidden flex-col">
  <!-- Content injected via JS -->
</div>

<!-- Main App Wrapper -->
<div id="app-wrapper" class="flex min-h-screen w-full hidden">
  <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden animate-fade-in"></div>

  <aside id="sidebar" class="fixed top-0 right-0 h-screen w-72 bg-app-surface/95 backdrop-blur-xl border-l border-app-border z-50 flex flex-col transform translate-x-full md:translate-x-0">
    <div class="p-6 border-b border-app-border flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-xl shadow-neon">L</div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">لقطة برو</h1>
          <p class="text-[10px] text-primary-400 font-medium tracking-wide uppercase">Studio Management</p>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="md:hidden text-app-muted hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto" id="nav-menu">
      <!-- Nav items generated dynamically -->
    </nav>

    <div class="p-5 border-t border-app-border bg-black/20">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-app-card flex items-center justify-center text-xs border border-app-border">⚙️</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold truncate text-white" id="sidebar-studio-name">الاستوديو</p>
          <p class="text-[10px] text-app-muted truncate" id="sidebar-studio-status">حالة الاشتراك</p>
        </div>
      </div>
      <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-bold py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        تسجيل الخروج
      </button>
    </div>
  </aside>

  <main id="main-content" class="flex-1 mr-0 md:mr-72 min-w-0 flex flex-col min-h-screen transition-all duration-300 relative">
    <!-- Trial Banner Injected Here if needed -->
    <header id="topbar" class="h-16 md:h-20 glass-card sticky top-0 z-30 flex items-center justify-between px-4 md:px-8 border-b border-app-border/50">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 text-app-muted hover:text-white rounded-lg hover:bg-app-hover">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h2 id="header-title" class="font-bold text-lg md:text-xl text-white hidden sm:block">الرئيسية</h2>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="openGlobalSearch()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-app-surface border border-app-border hover:bg-app-hover text-white transition-colors shadow-sm relative group" title="بحث في النظام">
          <span>🔍</span>
        </button>

        <div class="flex items-center gap-2 bg-app-bg border border-app-border rounded-xl p-1 shadow-inner">
          <button onclick="shiftMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted hover:text-white transition-colors">&lt;</button>
          <input type="month" id="global-month" onchange="onMonthChange(this.value)" class="bg-transparent border-none text-sm font-bold text-primary-400 outline-none px-2 cursor-pointer !shadow-none !border-transparent">
          <button onclick="shiftMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted hover:text-white transition-colors">&gt;</button>
        </div>
      </div>
    </header>

    <div class="p-4 md:p-8 flex-1" id="view-container">
      <!-- Views injected here -->
    </div>
  </main>
</div>

<!-- Modals & Toasts -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[250] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
  <div id="modal-content" class="bg-app-surface border border-app-border rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
    <!-- Modal content -->
  </div>
</div>

<div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 z-[300] flex flex-col gap-2 w-[90%] md:w-auto max-w-sm pointer-events-none"></div>

<script>
// --- SaaS Core Configuration ---
const MASTER_DB_KEY = 'laqta_saas_master_db';
let masterDB = { studios: [] };
let currentStudioId = null;
let currentStudio = null;

// --- Studio State (Active loaded data) ---
let state = {};

const defaultMsgs = {
  reminder: "مرحباً {name} 🎬\nتذكير بموعد تصوير غداً إن شاء الله.\nالرجاء الالتزام بالموعد.\n\n{company}",
  cancel: "مرحباً {name}\nيرجى العلم بأنه تم إلغاء/تأجيل أوردر التصوير.\nسنوافيك بالتفاصيل.\n\n{company}",
  portal: "مرحباً {name} 🌟\nرابط بوابتك لمتابعة مواعيدك ومستحقاتك:\n{url}\n\nيُرجى الاحتفاظ به.\n{company}",
  thanks: "مرحباً {name} 🌸\nشكراً لمجهودك الرائع في عمل اليوم.\n\n{company}",
  payment: "مرحباً {name} 💰\nمستحقاتك المالية جاهزة للاستلام، يرجى التواصل أو الحضور للاستلام.\n\n{company}"
};

let currentMonth = new Date().toISOString().slice(0, 7);
let currentView = 'dashboard';
let isPortalMode = false;
let portalPhotographerId = null;
let currentPortalSessionId = null;

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PAY_PERIODS = {
    'daily': { label: 'يومي', color: 'text-amber-400 bg-amber-500/10 border-amber-500/20' },
    'weekly': { label: 'أسبوعي', color: 'text-primary-400 bg-primary-500/10 border-primary-500/20' },
    'monthly': { label: 'شهري', color: 'text-purple-400 bg-purple-500/10 border-purple-500/20' }
};

const navItems = [
  { id: 'dashboard', icon: '📊', label: 'لوحة القيادة' },
  { id: 'events', icon: '🎬', label: 'أرشيف الأعمال' },
  { id: 'team', icon: '👥', label: 'الفريق والموارد' },
  { id: 'expenses', icon: '💸', label: 'الماليات والتصفيات' },
  { id: 'inventory', icon: '📦', label: 'المخزن والعهد' },
  { id: 'settings', icon: '⚙️', label: 'إعدادات النظام' }
];

function initApp() {
  loadMasterDB();

  const params = new URLSearchParams(window.location.search);
  const phoneParam = params.get('p');

  if (phoneParam) {
    // Photographers Portal Logic
    let found = false;
    for (const std of masterDB.studios) {
      if (std.data && std.data.photographers) {
        const p = std.data.photographers.find(x => formatPhone(x.phone) === formatPhone(phoneParam));
        if (p) {
          // Check block status before opening portal
          const subStatus = checkSubscriptionStatus(std);
          if (subStatus.isBlocked) {
             document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-black p-4"><div class="glass-card p-8 rounded-2xl text-center border border-red-500/30"><div class="w-16 h-16 bg-red-500/10 text-red-500 text-3xl flex items-center justify-center rounded-full mx-auto mb-4">🔒</div><h2 class="text-2xl font-bold text-white mb-2">النظام متوقف مؤقتاً</h2><p class="text-app-muted text-sm">الرجاء من إدارة الاستوديو مراجعة الدعم الفني.</p></div></div>`;
             return;
          }

          currentStudioId = std.id;
          currentStudio = std;
          state = std.data;
          ensureStateDefaults();

          isPortalMode = true; portalPhotographerId = p.id;
          document.body.classList.add('mode-portal');
          document.getElementById('auth-view').style.display = 'none';
          document.getElementById('app-wrapper').style.display = 'flex';
          renderPortalView();

          recordPortalActivity('login');
          window.addEventListener('beforeunload', () => recordPortalActivity('logout'));
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') recordPortalActivity('logout');
            else if (document.visibilityState === 'visible') recordPortalActivity('resume');
          });
          found = true;
          break;
        }
      }
    }
    if (!found) {
       document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-black p-4"><div class="glass-card p-8 rounded-2xl text-center border-red-500/30"><h2 class="text-2xl font-bold text-red-500 mb-3">ACCESS DENIED</h2><p class="text-app-muted">الرابط غير صالح أو تم إزالة صلاحيتك.</p></div></div>`;
    }
  } else {
    // Show Login
    document.getElementById('app-wrapper').style.display = 'none';
    document.getElementById('auth-view').style.display = 'flex';
  }
}

function loadMasterDB() {
  const saved = localStorage.getItem(MASTER_DB_KEY);
  if (saved) {
    masterDB = JSON.parse(saved);
  } else {
    // Migration from old app
    const oldData = localStorage.getItem('laqta_saas_v4');
    let initData = {};
    if (oldData) {
      try { initData = JSON.parse(oldData); } catch(e){}
    }
    
    const defaultStd = {
      id: 'std_' + generateId(),
      name: initData.settings?.companyName || 'استوديو افتراضي',
      email: 'admin@studio.com',
      phone: initData.settings?.phone || '0100000000',
      password: '123',
      status: 'trial',
      trialEndsAt: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString(),
      subscriptionEndsAt: null,
      pauseDate: null,
      data: initData
    };
    masterDB.studios.push(defaultStd);
    saveMasterDB();
  }
}

function saveMasterDB() {
  localStorage.setItem(MASTER_DB_KEY, JSON.stringify(masterDB));
}

function saveData() {
  if (currentStudioId && !isPortalMode) { // portal users shouldn't save state changes directly except logs
    const idx = masterDB.studios.findIndex(s => s.id === currentStudioId);
    if (idx > -1) {
      masterDB.studios[idx].data = state;
      saveMasterDB();
    }
  } else if (currentStudioId && isPortalMode) {
    // portal only saves logs
    const idx = masterDB.studios.findIndex(s => s.id === currentStudioId);
    if (idx > -1) {
       masterDB.studios[idx].data.portalLogs = state.portalLogs;
       saveMasterDB();
    }
  }
}

function ensureStateDefaults() {
  if (!state.settings) state.settings = {};
  if (!state.settings.companyName) state.settings.companyName = currentStudio?.name || 'استوديو لقطة';
  if (!state.settings.phone) state.settings.phone = currentStudio?.phone || '';
  if (!state.settings.msgs) state.settings.msgs = { ...defaultMsgs };
  if (state.settings.flashStock === undefined) state.settings.flashStock = 0;
  if (state.settings.flashPrice === undefined) state.settings.flashPrice = 0;
  if (!state.photographers) state.photographers = [];
  if (!state.halls) state.halls = [];
  if (!state.inventory) state.inventory = [];
  if (!state.events) state.events = [];
  if (!state.expenses) state.expenses = [];
  if (!state.supplierPackages) state.supplierPackages = []; 
  if (!state.portalLogs) state.portalLogs = [];
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login_email').value.trim().toLowerCase();
  const pass = document.getElementById('login_password').value;

  if (email === 'admin@laqta.com' && pass === 'admin123') {
    document.getElementById('auth-view').style.display = 'none';
    document.getElementById('admin-view').style.display = 'flex';
    renderAdminDashboard();
    return;
  }

  const std = masterDB.studios.find(s => s.email.toLowerCase() === email && s.password === pass);
  if (std) {
    loginStudio(std);
  } else {
    showToast('البريد أو كلمة المرور غير صحيحة', 'error');
  }
}

function loginStudio(std) {
  currentStudioId = std.id;
  currentStudio = std;
  state = std.data || {};
  ensureStateDefaults();
  
  const subStatus = checkSubscriptionStatus(std);
  
  document.getElementById('auth-view').style.display = 'none';
  document.getElementById('app-wrapper').style.display = 'flex';
  
  if (subStatus.isBlocked) {
    showSubscriptionLock(subStatus.msg);
  } else {
    // Normal App Init
    document.getElementById('global-month').value = currentMonth;
    renderNav();
    document.getElementById('sidebar-studio-name').textContent = state.settings.companyName;
    
    // Set Status Badge in Sidebar
    const statusEl = document.getElementById('sidebar-studio-status');
    if (subStatus.reason === 'active') {
      statusEl.innerHTML = `<span class="text-emerald-400 font-bold px-1.5 py-0.5 bg-emerald-500/10 rounded">نسخة مُفعلة (باقة نشطة)</span>`;
    } else {
      statusEl.innerHTML = `<span class="text-primary-400 font-bold px-1.5 py-0.5 bg-primary-500/10 rounded">فترة تجريبية - ${subStatus.daysLeft} أيام</span>`;
    }

    nav('dashboard');
    
    if (subStatus.reason === 'trial') {
      showTrialBanner(subStatus.daysLeft);
    }
  }
}

function checkSubscriptionStatus(std) {
  const now = new Date();
  
  if (std.status === 'paused') {
    return { isBlocked: true, reason: 'paused', msg: 'الاشتراك موقوف مؤقتاً بطلب من الإدارة.' };
  }
  
  if (std.status === 'trial') {
    const end = new Date(std.trialEndsAt);
    if (now > end) {
      return { isBlocked: true, reason: 'expired', msg: 'انتهت الفترة التجريبية الخاصة بك.' };
    }
    return { isBlocked: false, reason: 'trial', daysLeft: Math.ceil((end - now) / (1000 * 60 * 60 * 24)) };
  }
  
  if (std.status === 'active') {
    const end = new Date(std.subscriptionEndsAt);
    if (now > end) {
      return { isBlocked: true, reason: 'expired', msg: 'عذراً، لقد انتهت فترة اشتراكك في لقطة برو.' };
    }
    return { isBlocked: false, reason: 'active', daysLeft: Math.ceil((end - now) / (1000 * 60 * 60 * 24)) };
  }
  
  return { isBlocked: true, reason: 'unknown', msg: 'حالة الاشتراك غير معروفة.' };
}

function logout() {
  currentStudioId = null;
  currentStudio = null;
  state = {};
  
  document.getElementById('app-wrapper').style.display = 'none';
  document.getElementById('admin-view').style.display = 'none';
  document.getElementById('auth-view').style.display = 'flex';
  document.getElementById('login_password').value = '';
  
  const banner = document.getElementById('main-content').querySelector('.bg-primary-500.text-white');
  if (banner) banner.remove();
  
  document.getElementById('sidebar').style.display = '';
  document.getElementById('topbar').style.display = '';
  document.getElementById('view-container').innerHTML = '';
}

function showSubscriptionLock(msg) {
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  const container = document.getElementById('view-container');
  container.innerHTML = `
    <div class="min-h-[85vh] flex flex-col items-center justify-center animate-fade-in">

  const name = document.getElementById('new_std_name').value.trim();
  const email = document.getElementById('new_std_email').value.trim().toLowerCase();
  const phone = document.getElementById('new_std_phone').value.trim();
  const pass = document.getElementById('new_std_pass').value.trim();
  
  if(!name || !email || !pass) return showToast('الرجاء إكمال البيانات الأساسية', 'error');
  if(masterDB.studios.find(s => s.email.toLowerCase() === email)) return showToast('البريد مسجل مسبقاً لاستوديو آخر', 'error');

  const newStd = {
    id: 'std_' + generateId(),
    name, email, phone, password: pass,
    status: 'trial',
    trialEndsAt: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString(),
    subscriptionEndsAt: null,
    pauseDate: null,
    data: {

      photographers: [], halls: [], inventory: [], events: [], expenses: [], supplierPackages: [], portalLogs: []

  masterDB.studios.push(newStd);

  closeModal();

             `<button onclick="updateSub('${id}', 'resume')" class="bg-emerald-500/10 border border-emerald-500/30 hover:bg-emerald-500/20 text-emerald-400 p-3 rounded-xl text-sm font-bold transition-all shadow-sm">▶️ استئناف الاشتراك الموقوف</button>`
           }
        </div>
      </div>
    </div>
  `;
  openModal('إدارة اشتراك الاستوديو', content);
}

function updateSub(id, action) {
  const std = masterDB.studios.find(s => s.id === id);
  if(!std) return;
  const now = new Date();
  
  if (action === 'trial') {
    std.status = 'trial';
    std.trialEndsAt = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000).toISOString();
  } else if (action === 'pause') {
    std.status = 'paused';
    std.pauseDate = now.toISOString();
  } else if (action === 'resume') {
    if (std.pauseDate) {
      const pausedTime = now.getTime() - new Date(std.pauseDate).getTime();
      if (std.subscriptionEndsAt) std.subscriptionEndsAt = new Date(new Date(std.subscriptionEndsAt).getTime() + pausedTime).toISOString();
      if (std.trialEndsAt) std.trialEndsAt = new Date(new Date(std.trialEndsAt).getTime() + pausedTime).toISOString();
    }
    std.status = std.subscriptionEndsAt && new Date(std.subscriptionEndsAt) > now ? 'active' : 'trial';
    std.pauseDate = null;
  } else {
    // 1m, 3m, 6m, 1y
    std.status = 'active';
    let baseDate = now;
    if (std.subscriptionEndsAt && new Date(std.subscriptionEndsAt) > now) {
      baseDate = new Date(std.subscriptionEndsAt);
    }
    
    let monthsToAdd = 0;
    if(action === '1m') monthsToAdd = 1;
    if(action === '3m') monthsToAdd = 3;
    if(action === '6m') monthsToAdd = 6;
    if(action === '1y') monthsToAdd = 12;
    
    baseDate.setMonth(baseDate.getMonth() + monthsToAdd);
    std.subscriptionEndsAt = baseDate.toISOString();
  }
  
  saveMasterDB();
  closeModal();
  renderAdminDashboard();
  showToast('تم تحديث حالة الاشتراك والمدد الزمنية بنجاح', 'success');
}

function recordPortalActivity(type) {
  if (!portalPhotographerId) return;
  if (!state.portalLogs) state.portalLogs = [];

  if (type === 'login') {
    currentPortalSessionId = generateId();
    state.portalLogs.push({ id: currentPortalSessionId, pId: portalPhotographerId, loginTime: new Date().toISOString(), logoutTime: null });
    saveData();
  } else if (type === 'logout' && currentPortalSessionId) {
    const session = state.portalLogs.find(x => x.id === currentPortalSessionId);
    if (session && !session.logoutTime) {
      session.logoutTime = new Date().toISOString();
      saveData();
    }
  } else if (type === 'resume' && currentPortalSessionId) {
    const session = state.portalLogs.find(x => x.id === currentPortalSessionId);
    if (session && session.logoutTime) {
      session.logoutTime = null; // Remove logout time to resume
      saveData();
    }
  }
}

const formatTime = (iso) => {
  if(!iso) return '<span class="text-emerald-400 font-bold animate-pulse text-[10px] bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">متصل الآن</span>';
  return new Date(iso).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true});
};

const generateId = () => Math.random().toString(36).substr(2, 9);
const formatMoney = (num) => Number(num || 0).toLocaleString('en-US') + ' ج';
const formatDateAr = (dateStr) => {
  if(!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d} ${MONTHS_AR[parseInt(m)-1]} ${y}`;
};
const getInitials = (name) => name ? name.trim().charAt(0) : '?';
const formatPhone = (phone) => {
  let p = (phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '20' + p.substring(1);
  return p;
};

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const isOk = type === 'success';
  toast.className = `glass-card border-l-4 ${isOk ? 'border-l-emerald-500' : 'border-l-red-500'} p-4 rounded-2xl flex items-center gap-4 transform translate-y-10 opacity-0 transition-all duration-300 shadow-xl`;
  toast.innerHTML = `

function performGlobalSearch(query) {
  const resultsContainer = document.getElementById('global_search_results');
  if(!query || query.trim() === '') {
    resultsContainer.innerHTML = `<div class="text-center text-app-muted py-10 text-sm font-medium">ابدأ الكتابة للبحث في جميع السجلات</div>`;
    return;
  }
  
  query = query.toLowerCase().trim();
  let results = [];

  state.events.forEach(e => {
    if ( (e.clientName && e.clientName.toLowerCase().includes(query)) || (e.clientPhone && e.clientPhone.includes(query)) || (e.address && e.address.toLowerCase().includes(query)) ) {
        results.push({ type: 'client', data: e });
    }
  });

  state.photographers.forEach(p => {
    if ((p.name && p.name.toLowerCase().includes(query)) || (p.phone && p.phone.includes(query))) {
        results.push({ type: 'photog', data: p });
    }

  state.supplierPackages.forEach(pkg => {

        results.push({ type: 'supplier', data: pkg });

  resultsContainer.innerHTML = results.map(res => {
      if (res.type === 'client') {

          return `

                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] font-bold text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded">عميل</span>
                  <p class="font-bold text-white text-sm group-hover:text-primary-400 transition-colors">${e.clientName || 'بدون اسم'}</p>
                </div>
                <p class="text-[10px] text-app-muted">هاتف: <span class="text-white" dir="ltr">${e.clientPhone || '---'}</span> | مناسبة: ${hName} (${formatDateAr(e.date)})</p>
              </div>
              <span class="text-app-muted group-hover:text-primary-400 transition-transform group-hover:-translate-x-1">←</span>
            </div>

      } else if (res.type === 'photog') {
          const p = res.data;
          return `
            <div onclick="closeModal(); setTimeout(()=>openPhotogDetailsModal('${p.id}'), 300)" class="bg-app-surface border border-app-border p-4 rounded-xl hover:border-amber-500/50 hover:bg-app-hover transition-colors cursor-pointer flex justify-between items-center group shadow-sm">

function shiftMonth(delta) {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  document.getElementById('global-month').value = currentMonth;
  if(isPortalMode) renderPortalView(); else renderView();
}

function getEventsForMonth(month) { return state.events.filter(e => e.date.startsWith(month)); }

function getPhotographerStats(pId, month) {
  const events = getEventsForMonth(month).filter(e => (e.photographerIds || []).includes(pId));
  const p = state.photographers.find(x => x.id === pId) || { wage: 0 };
  
  let days = events.length; 
  let baseWageTotal = days * Number(p.wage);
  let equipmentTotal = 0;
  let bonusesTotal = 0;
  
  events.forEach(e => {
    (e.equipmentRent || []).filter(eq => eq.pId === pId).forEach(eq => equipmentTotal += Number(eq.price));
    (e.bonuses || []).filter(b => b.pId === pId).forEach(b => bonusesTotal += Number(b.amount));
  });

  const payoutsThisMonth = state.expenses.filter(ex => ex.type === 'payout' && ex.pId === pId && ex.date.startsWith(month))
                                        .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const totalEarned = baseWageTotal + equipmentTotal + bonusesTotal;
  return { events, days, baseWageTotal, equipmentTotal, bonusesTotal, totalEarned, payoutsThisMonth, remainingDue: totalEarned - payoutsThisMonth };
}

function getAllTimePhotographerStats(pId) {
  let totalEarned = 0;
  let totalPaid = 0;
  
  state.events.forEach(e => {
      if((e.photographerIds || []).includes(pId)) {
          const p = state.photographers.find(x => x.id === pId) || { wage: 0 };
          totalEarned += Number(p.wage);
          (e.equipmentRent || []).filter(eq => eq.pId === pId).forEach(eq => totalEarned += Number(eq.price));
          (e.bonuses || []).filter(b => b.pId === pId).forEach(b => totalEarned += Number(b.amount));
      }
  });
  
  state.expenses.forEach(ex => {
      if (ex.type === 'payout' && ex.pId === pId) {
          totalPaid += Number(ex.amount);
      }
  });

  return { totalEarned, totalPaid, overallRemaining: totalEarned - totalPaid };
}

function getDashboardStats(month) {
  const events = getEventsForMonth(month);
  let revenue = 0, equipmentRentTotal = 0, supplierCostsTotal = 0, totalDiscounts = 0;
  
  events.forEach(e => {
    const baseRev = Number(e.revenue || 0);
    const discount = Number(e.discount || 0);
    const pkgClient = (e.packages || []).reduce((s, p) => s + Number(p.clientPrice), 0);
    const pkgSupplier = (e.packages || []).reduce((s, p) => s + Number(p.supplierCost), 0);
    
    revenue += (baseRev + pkgClient - discount);
    totalDiscounts += discount;
    supplierCostsTotal += pkgSupplier;
    (e.equipmentRent || []).forEach(eq => equipmentRentTotal += Number(eq.price));
  });

  let wagesTotal = state.photographers.reduce((sum, p) => sum + getPhotographerStats(p.id, month).baseWageTotal, 0);
  let generalExpenses = state.expenses.filter(ex => ex.type === 'general' && ex.date.startsWith(month))
                                      .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const netProfit = revenue - wagesTotal - equipmentRentTotal - supplierCostsTotal - generalExpenses;

  return { revenue, wagesTotal, equipmentRentTotal, supplierCostsTotal, totalDiscounts, generalExpenses, netProfit, eventsCount: events.length };
}

      <p class="font-bold text-xl ${color}">${val}</p>
    </div>
  `;

  if (type === 'revenue') {
     title = 'تحليل الإيرادات';
     const extCount = monthEvents.filter(e => !state.halls.find(x=>x.id===e.hallId)).length;
     summaryHtml = `<div class="grid grid-cols-3 gap-3 mb-5">${createStatBox('إجمالي الإيراد', formatMoney(stats.revenue), 'text-emerald-400')}${createStatBox('إجمالي الأعمال', stats.eventsCount, 'text-white')}${createStatBox('أعمال خارجية', extCount, 'text-primary-400')}</div>`;
     listHtml = monthEvents.map(e => `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors cursor-pointer" onclick="closeModal(); showEventDetails('${e.id}')"><div><p class="text-sm text-white font-bold">${state.halls.find(x=>x.id===e.hallId)?.name||'موقع خارجي'}</p><p class="text-xs text-app-muted mt-1">${formatDateAr(e.date)}</p></div><span class="text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1.5 rounded-lg">${formatMoney(e.revenue)}</span></div>`).join('');
  
  } else if (type === 'wages') {
     title = 'تحليل أجور الطاقم (الأساسية)';
     let activePhotogs = 0;
     const photogList = state.photographers.map(p => {
         const pStats = getPhotographerStats(p.id, currentMonth);
         if(pStats.baseWageTotal > 0) activePhotogs++;
         return pStats.baseWageTotal > 0 ? `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors cursor-pointer" onclick="closeModal(); openPhotogDetailsModal('${p.id}')"><div><p class="text-sm text-white font-bold flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400"></span>${p.name}</p><p class="text-xs text-app-muted mt-1">عمل ${pStats.days} أيام</p></div><span class="text-amber-400 font-bold bg-amber-500/10 px-3 py-1.5 rounded-lg">${formatMoney(pStats.baseWageTotal)}</span></div>` : '';
     }).join('');
     summaryHtml = `<div class="grid grid-cols-2 gap-3 mb-5">${createStatBox('إجمالي الأجور', formatMoney(stats.wagesTotal), 'text-amber-400')}${createStatBox('أفراد شاركوا بالعمل', activePhotogs, 'text-white')}</div>`;
     listHtml = photogList;

  } else if (type === 'equipment') {
     title = 'تحليل إيجار المعدات الداخلية';
     const photogList = state.photographers.map(p => {
         const pStats = getPhotographerStats(p.id, currentMonth);
         return pStats.equipmentTotal > 0 ? `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0"><div><p class="text-sm text-white font-bold flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-purple-400"></span>${p.name}</p></div><span class="text-purple-400 font-bold bg-purple-500/10 px-3 py-1.5 rounded-lg">${formatMoney(pStats.equipmentTotal)}</span></div>` : '';
     }).join('');
     summaryHtml = `<div class="grid grid-cols-1 mb-5">${createStatBox('إجمالي إيجار المعدات', formatMoney(stats.equipmentRentTotal), 'text-purple-400')}</div>`;
     listHtml = photogList;

  } else if (type === 'supplier') {
     title = 'تحليل تكلفة الموردين والخدمات';
     const supplierEvents = monthEvents.filter(e => e.packages && e.packages.length > 0);
     let totalCost = 0;
     const eventsList = supplierEvents.map(e => {
         const cost = e.packages.reduce((s, p) => s + Number(p.supplierCost), 0);
         totalCost += cost;
         const pkgNames = e.packages.map(p => p.name).join('، ');
         return `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors cursor-pointer" onclick="closeModal(); showEventDetails('${e.id}')"><div><p class="text-sm text-white font-bold">${state.halls.find(x=>x.id===e.hallId)?.name||'موقع خارجي'}</p><p class="text-xs text-app-muted mt-1 w-48 truncate">${pkgNames}</p></div><span class="text-pink-400 font-bold bg-pink-500/10 px-3 py-1.5 rounded-lg">${formatMoney(cost)}</span></div>`;
     }).join('');
     summaryHtml = `<div class="grid grid-cols-1 mb-5">${createStatBox('إجمالي تكلفة الموردين', formatMoney(stats.supplierCostsTotal), 'text-pink-400')}</div>`;
     listHtml = eventsList;

  } else if (type === 'discounts') {
     title = 'تحليل الخصومات الممنوحة للعملاء';
     const discountEvents = monthEvents.filter(e => e.discount && e.discount > 0);
     const eventsList = discountEvents.map(e => `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors cursor-pointer" onclick="closeModal(); showEventDetails('${e.id}')"><div><p class="text-sm text-white font-bold">${state.halls.find(x=>x.id===e.hallId)?.name||'موقع خارجي'}</p><p class="text-xs text-app-muted mt-1">${formatDateAr(e.date)}</p></div><span class="text-red-400 font-bold bg-red-500/10 px-3 py-1.5 rounded-lg">${formatMoney(e.discount)}</span></div>`).join('');
     summaryHtml = `<div class="grid grid-cols-1 mb-5">${createStatBox('إجمالي الخصومات', formatMoney(stats.totalDiscounts), 'text-red-400')}</div>`;
     listHtml = eventsList;

  } else if (type === 'expenses') {
     title = 'المصروفات العامة المنفصلة';
     const genEx = state.expenses.filter(ex => ex.type === 'general' && ex.date.startsWith(currentMonth));
     summaryHtml = `<div class="grid grid-cols-2 gap-3 mb-5">${createStatBox('إجمالي المصروفات', formatMoney(stats.generalExpenses), 'text-red-400')}${createStatBox('عدد الحركات', genEx.length, 'text-white')}</div>`;
     listHtml = genEx.map(ex => `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors"><div><p class="text-sm text-white font-bold">${ex.desc}</p><p class="text-xs text-app-muted mt-1">${formatDateAr(ex.date)}</p></div><span class="text-red-400 font-bold bg-red-500/10 px-3 py-1.5 rounded-lg">${formatMoney(ex.amount)}</span></div>`).join('');

  } else if (type === 'net') {
     title = 'حساب صافي الأرباح الدقيق (للشهر)';
     const totalCosts = stats.wagesTotal + stats.equipmentRentTotal + stats.supplierCostsTotal + stats.generalExpenses;
     summaryHtml = `
      <div class="bg-primary-500/10 p-6 rounded-2xl border border-primary-500/30 text-center mb-5 relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-t from-primary-500/10 to-transparent"></div>
        <p class="text-xs font-bold text-primary-400 mb-2 relative z-10 uppercase tracking-widest">الربح الصافي الفعلي للاستوديو</p>
        <h2 class="text-5xl text-emerald-400 font-bold drop-shadow-md relative z-10">${formatMoney(stats.netProfit)}</h2>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-2">
        <div class="bg-app-surface p-4 rounded-xl border border-app-border flex flex-col items-center justify-center"><span class="text-xs font-bold text-app-muted mb-1">إجمالي الدخل</span><span class="font-bold text-white text-lg">${formatMoney(stats.revenue)}</span></div>
        <div class="bg-app-surface p-4 rounded-xl border border-app-border flex flex-col items-center justify-center"><span class="text-xs font-bold text-app-muted mb-1">إجمالي التكاليف</span><span class="font-bold text-red-400 text-lg">${formatMoney(totalCosts)}</span></div>
      </div>
     `;
     listHtml = `<div class="p-4 bg-app-bg border border-app-border rounded-xl mt-4"><p class="text-xs text-app-muted text-center font-medium leading-relaxed">صافي الربح = (الإيرادات مضافاً لها أسعار بيع الخدمات مطروحاً منها الخصم) - (أجور الطاقم + المعدات + تكلفة الموردين + المصروفات العامة)</p></div>`;

  } else if (type === 'days') {
     title = 'حجم الأعمال (هذا الشهر)';
     const eventsOnly = monthEvents.filter(e => e.type === 'event').length;
     const dailyOnly = monthEvents.filter(e => e.type === 'daily').length;
     summaryHtml = `<div class="grid grid-cols-3 gap-3 mb-5">${createStatBox('إجمالي الأعمال', stats.eventsCount, 'text-white')}${createStatBox('مناسبات متكاملة', eventsOnly, 'text-primary-400')}${createStatBox('يوميات عمل', dailyOnly, 'text-amber-400')}</div>`;
     listHtml = monthEvents.map(e => `<div class="flex justify-between items-center p-4 border-b border-app-border last:border-0 hover:bg-app-hover rounded-xl transition-colors cursor-pointer" onclick="closeModal(); showEventDetails('${e.id}')"><div><span class="text-[10px] font-bold ${e.type === 'event' ? 'text-primary-400 bg-primary-500/10 border-primary-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20'} px-2 py-0.5 rounded border mr-1">${e.type === 'event' ? 'مناسبة' : 'يومية'}</span><span class="text-sm text-white font-bold ml-1">${state.halls.find(x=>x.id===e.hallId)?.name||'موقع خارجي'}</span><p class="text-xs text-app-muted mt-2">${formatDateAr(e.date)}</p></div><span class="text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1.5 rounded-lg">${formatMoney(e.revenue)}</span></div>`).join('');
  }

  if(!listHtml && type !== 'net') listHtml = '<p class="text-app-muted text-center py-10 text-sm font-medium border border-dashed border-app-border rounded-xl">لا توجد حركات مسجلة في هذا التصنيف.</p>';
  
  openModal(title, `<div>${summaryHtml}<div class="bg-app-surface rounded-xl border border-app-border p-2 shadow-inner">${listHtml}</div></div>`);
}

function renderEvents(container) {
  const events = getEventsForMonth(currentMonth).sort((a,b) => b.date.localeCompare(a.date));
  
  const hallStats = {};
  events.forEach(e => {
      if(!e.hallId) return;
      if(!hallStats[e.hallId]) hallStats[e.hallId] = { count: 0, revenue: 0 };
      hallStats[e.hallId].count++;
      hallStats[e.hallId].revenue += Number(e.revenue || 0);
  });

  const hallBoxes = state.halls.map(h => {
    const s = hallStats[h.id] || {count: 0, revenue: 0};
    if(s.count === 0) return '';
    return `<div class="bg-app-surface border border-app-border p-4 rounded-2xl text-center shadow-sm">
      <h4 class="font-bold text-white text-sm truncate mb-1">${h.name}</h4>
      <p class="text-[10px] font-bold text-app-muted mb-2 bg-app-bg inline-block px-2 py-0.5 rounded">${s.count} أعمال</p>
      <p class="font-bold text-primary-400 text-lg">${formatMoney(s.revenue)}</p>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <h3 class="font-bold text-2xl text-white">أرشيف الأعمال</h3>
      <div class="flex gap-2">
         <button onclick="openEventModal('event')" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-bold shadow-neon flex items-center gap-2"><span class="text-lg">🎬</span> حجز مناسبة</button>
         <button onclick="openEventModal('daily')" class="bg-app-surface border border-app-border text-white hover:bg-app-hover px-5 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center gap-2"><span class="text-lg">⚡</span> يومية</button>
      </div>
    </div>
    ${hallBoxes ? `<div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 mb-6">${hallBoxes}</div>` : ''}
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
      ${events.length === 0 ? '<p class="text-app-muted col-span-full text-center py-12 border border-dashed border-app-border rounded-2xl font-medium">لا توجد أعمال مسجلة هذا الشهر. ابدأ بتسجيل مناسبة جديدة.</p>' : ''}
      ${events.map(e => {
        const h = state.halls.find(x => x.id === e.hallId) || {name: e.clientName || 'موقع خارجي'};
        const photogs = (e.photographerIds || []).map(pid => (state.photographers.find(x => x.id === pid) || {}).name).filter(Boolean);
        return `
          <div onclick="showEventDetails('${e.id}')" class="glass-card interactive-card p-6 rounded-3xl flex flex-col gap-4 group">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-bold ${e.type === 'event' ? 'text-primary-400 bg-primary-500/10 border border-primary-500/20' : 'text-amber-400 bg-amber-500/10 border border-amber-500/20'} px-2 py-1 rounded-md mb-3 inline-block">${e.type === 'event' ? 'مناسبة' : 'يومية'}</span>
                <h4 class="font-bold text-white text-lg group-hover:text-primary-400 transition-colors">${h.name}</h4>
              </div>
              <div class="text-left">
                <span class="text-sm font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-lg shadow-sm">${formatMoney(e.revenue)}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs font-medium text-app-muted bg-app-bg p-2 rounded-lg border border-app-border">
              <span class="text-lg">📅</span> ${formatDateAr(e.date)}
            </div>
            ${photogs.length ? `<div class="flex items-center gap-2 text-xs font-medium text-app-muted truncate bg-app-bg p-2 rounded-lg border border-app-border"><span class="text-lg">👥</span> ${photogs.join('، ')}</div>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function showEventDetails(id) {
  const e = state.events.find(x => x.id === id);
  if(!e) return;
  const h = state.halls.find(x => x.id === e.hallId) || {name: 'موقع خارجي', id: 'external'};
  
  const monthEvents = getEventsForMonth(currentMonth);
  const hallEvents = monthEvents.filter(ev => ev.hallId === h.id);
  const hallRev = hallEvents.reduce((s, ev) => s + Number(ev.revenue || 0), 0);

  let totalWages = 0;
  const photogDetails = (e.photographerIds||[]).map(pid => {
    const p = state.photographers.find(x => x.id === pid) || {name: 'غير معروف', wage: 0};
    const pWage = Number(p.wage);
    totalWages += pWage;
    const pEq = (e.equipmentRent||[]).filter(eq => eq.pId === pid).reduce((sum, eq) => sum + Number(eq.price), 0);
    const pBonus = (e.bonuses||[]).filter(b => b.pId === pid).reduce((sum, b) => sum + Number(b.amount), 0);
    const pTotal = pWage + pEq + pBonus;
    return { ...p, pWage, pEq, pBonus, pTotal };
  });

  const eqTotal = (e.equipmentRent||[]).reduce((sum, eq) => sum + Number(eq.price), 0);
  
  const baseRev = Number(e.revenue || 0);
  const discount = Number(e.discount || 0);
  const pkgClientTotal = (e.packages || []).reduce((sum, p) => sum + Number(p.clientPrice), 0);
  const pkgSupplierTotal = (e.packages || []).reduce((sum, p) => sum + Number(p.supplierCost), 0);
  
  const finalRevenue = baseRev + pkgClientTotal - discount;
  const totalExpenses = totalWages + eqTotal + pkgSupplierTotal;
  const netProfit = finalRevenue - totalExpenses;

  const content = `
    <div class="space-y-6">
      <div class="flex justify-between items-start border-b border-app-border pb-5">
        <div>
          <span class="text-[10px] font-bold ${e.type === 'event' ? 'text-primary-400 bg-primary-500/10 border-primary-500/20' : 'text-amber-400 bg-amber-500/10 border-amber-500/20'} border px-2 py-1 rounded-md mb-2 inline-block">${e.type === 'event' ? 'حجز مناسبة متكامل' : 'يومية عمل مسجلة'}</span>
          <h4 class="font-bold text-3xl text-white">${h.name}</h4>
          <p class="text-xs font-medium text-app-muted mt-2">إحصائيات هذا الموقع للشهر الحالي: <span class="text-white">${hallEvents.length} أعمال</span> | إجمالي الإيراد: <span class="text-emerald-400">${formatMoney(hallRev)}</span></p>
        </div>
        <div class="text-left bg-app-surface p-3 rounded-xl border border-app-border">
          <p class="text-[10px] font-bold text-app-muted mb-1 uppercase tracking-wider">تاريخ التنفيذ</p>
          <p class="font-bold text-white text-lg">${formatDateAr(e.date)}</p>
        </div>
      </div>
      
      ${e.clientName || e.address ? `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-app-surface p-5 rounded-2xl border border-app-border shadow-sm">
        ${e.clientName ? `<div><p class="text-[10px] font-bold text-app-muted mb-1.5 uppercase">العميل</p><p class="text-base font-bold text-white">${e.clientName} ${e.clientPhone ? `<br><span class="text-xs text-app-muted font-medium bg-app-bg px-2 py-0.5 rounded mt-1 inline-block" dir="ltr">📞 ${e.clientPhone}</span>` : ''}</p></div>` : ''}
        ${e.address ? `<div><p class="text-[10px] font-bold text-app-muted mb-1.5 uppercase">العنوان وموقع التنفيذ</p><p class="text-sm font-bold text-white leading-relaxed">${e.address}</p></div>` : ''}
      </div>` : ''}

      <!-- Financial Breakdown -->
      <div>
         <h4 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><span class="text-xl">📊</span> التحليل المالي للعملية</h4>
         <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div class="bg-app-surface border border-app-border p-4 rounded-2xl hover:border-primary-500/30 transition-colors">
              <p class="text-[10px] font-bold text-app-muted mb-1.5">الإيراد النهائي (مُحصل من العميل)</p>
              <p class="font-bold text-white text-2xl">${formatMoney(finalRevenue)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-4 rounded-2xl hover:border-amber-500/30 transition-colors">
              <p class="text-[10px] font-bold text-app-muted mb-1.5">إجمالي أجور الطاقم</p>
              <p class="font-bold text-amber-400 text-xl">${formatMoney(totalWages)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-4 rounded-2xl hover:border-purple-500/30 transition-colors">
              <p class="text-[10px] font-bold text-app-muted mb-1.5">تكلفة إيجار المعدات</p>
              <p class="font-bold text-purple-400 text-xl">${formatMoney(eqTotal)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-4 rounded-2xl hover:border-pink-500/30 transition-colors">
              <p class="text-[10px] font-bold text-app-muted mb-1.5">تكلفة خدمات الموردين</p>
              <p class="font-bold text-pink-400 text-xl">${formatMoney(pkgSupplierTotal)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-4 rounded-2xl hover:border-red-500/30 transition-colors">
              <p class="text-[10px] font-bold text-app-muted mb-1.5">خصم إضافي للعميل</p>
              <p class="font-bold text-red-400 text-xl">${formatMoney(discount)}</p>
            </div>
            <div class="bg-primary-500/10 border border-primary-500/30 p-4 rounded-2xl shadow-inner relative overflow-hidden">
              <div class="absolute right-0 top-0 w-20 h-20 bg-primary-500/20 blur-2xl rounded-full"></div>
              <p class="text-[10px] font-bold text-primary-400 mb-1.5 relative z-10">الربح الصافي للاستوديو</p>
              <p class="font-bold text-3xl text-emerald-400 relative z-10">${formatMoney(netProfit)}</p>
            </div>
         </div>
         
         ${(e.packages && e.packages.length > 0) ? `
         <div class="mt-4 bg-app-bg border border-app-border rounded-2xl p-5 shadow-inner">
           <p class="text-xs font-bold text-white mb-4 flex items-center gap-2"><span class="text-lg">📦</span> الخدمات الخارجية والباقات المضافة:</p>
           ${e.packages.map(p => `
             <div class="flex flex-col sm:flex-row justify-between sm:items-center text-xs mb-3 last:mb-0 border-b border-app-border/50 pb-3 last:border-0 last:pb-0 gap-3">
               <div>
                 <span class="text-white font-bold text-base">${p.name}</span>
                 <span class="text-primary-400 font-bold bg-primary-500/10 px-2 py-0.5 rounded ml-2">x${p.qty || 1}</span>
                 ${p.details ? `<p class="text-[10px] text-app-muted mt-1.5 font-medium">تفاصيل: ${p.details}</p>` : ''}
               </div>
               <div class="flex items-center gap-2 shrink-0">
                 <span class="text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-lg font-bold border border-emerald-500/20">بيع: ${formatMoney(p.clientPrice)}</span>
                 <span class="text-red-400 bg-red-500/10 px-3 py-1.5 rounded-lg font-bold border border-red-500/20">تكلفة: ${formatMoney(p.supplierCost)}</span>
               </div>
             </div>
           `).join('')}
         </div>
         ` : ''}
      </div>

      <!-- Team Breakdown -->
      <div>
        <h4 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><span class="text-xl">👥</span> طاقم العمل (المشاركين في التنفيذ)</h4>
        <div class="space-y-3">
           ${photogDetails.length ? photogDetails.map(p => `
             <div class="bg-app-surface border border-app-border p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 group hover:border-primary-500/30 transition-colors shadow-sm">
               <div class="flex items-center gap-3">
                 <div class="w-10 h-10 rounded-full bg-app-bg border border-app-border flex items-center justify-center text-white font-bold">${getInitials(p.name)}</div>
                 <p class="font-bold text-white text-base">${p.name}</p>
               </div>
               <div class="flex flex-wrap gap-2 text-left bg-app-bg p-2 rounded-xl border border-app-border w-full md:w-auto shadow-inner items-center">
                 <div class="px-3 py-1 border-l border-app-border/50 last:border-0"><p class="text-[9px] font-bold text-app-muted uppercase">أجر أساسي</p><p class="text-xs font-bold text-white">${formatMoney(p.pWage)}</p></div>
                 ${p.pEq > 0 ? `<div class="px-3 py-1 border-l border-app-border/50 last:border-0"><p class="text-[9px] font-bold text-app-muted uppercase">معدات</p><p class="text-xs font-bold text-purple-400">${formatMoney(p.pEq)}</p></div>` : ''}
                 ${p.pBonus > 0 ? `<div class="px-3 py-1 border-l border-app-border/50 last:border-0"><p class="text-[9px] font-bold text-app-muted uppercase">مكافأة</p><p class="text-xs font-bold text-pink-400">${formatMoney(p.pBonus)}</p></div>` : ''}
                 <div class="px-4 py-1 bg-primary-500/10 rounded-lg ml-1"><p class="text-[9px] font-bold text-primary-400 uppercase">إجمالي مستحق</p><p class="text-sm font-bold text-emerald-400">${formatMoney(p.pTotal)}</p></div>
               </div>
             </div>
           `).join('') : '<p class="text-app-muted text-sm border border-dashed border-app-border rounded-2xl p-6 text-center font-medium">لم يتم تعيين طاقم لهذه العملية.</p>'}
        </div>
      </div>
    </div>
  `;

  const footer = `
    <button onclick="sendWAInvoice('${e.id}')" class="btn-primary w-full sm:w-auto px-6 py-3.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-neon transition-transform hover:-translate-y-0.5">
      <span class="text-xl">📱</span> إرسال الفاتورة (واتساب)
    </button>
    <button onclick="openEventModal('${e.type}', '${e.id}')" class="bg-app-surface border border-app-border text-white hover:bg-app-hover w-full sm:w-auto px-6 py-3.5 rounded-xl text-sm font-bold transition-colors">
      تعديل بيانات العملية
    </button>
  `;

  openModal('التقرير المالي للعملية', content, footer);
}

function sendWAInvoice(id) {
  const e = state.events.find(x => x.id === id);
  const h = state.halls.find(x => x.id === e.hallId) || {name: ''};
  
  let msg = `✨ *${state.settings.companyName}* ✨\n`;

function saveEvent() {
  const id = document.getElementById('ev_id').value || generateId();
  const type = document.getElementById('ev_type').value;
  const isEvent = type === 'event';
  const date = document.getElementById('ev_date').value;
  
  const hallId = (!isEvent && document.getElementById('ev_hall')) ? document.getElementById('ev_hall').value : '';
  const revenue = document.getElementById('ev_revenue').value;
  
  if(!date || !revenue) { showToast('الرجاء إكمال البيانات الأساسية والإيراد', 'error'); return; }
  if(!isEvent && !hallId) { showToast('الرجاء اختيار القاعة لليومية', 'error'); return; }

  let selectedPackages = [];
  if (isEvent) {
      selectedPackages = Array.from(document.querySelectorAll('.pkg-row')).map(r => {
          const pkgId = r.querySelector('.pkg-select').value;
          const qty = Number(r.querySelector('.pkg-qty').value) || 1;
          const details = r.querySelector('.pkg-details').value;
          if (!pkgId) return null;
          const pkg = state.supplierPackages.find(p => p.id === pkgId);
          if (!pkg) return null;
          return {
              id: pkg.id, name: pkg.name, qty: qty, details: details,
              clientPrice: pkg.clientPrice * qty,
              supplierCost: pkg.supplierCost * qty
          };
      }).filter(Boolean);
  }

  const evData = {
    id, type,
    date, hallId, revenue: Number(revenue),
    discount: isEvent ? Number(document.getElementById('ev_discount')?.value || 0) : 0,
    clientName: isEvent ? (document.getElementById('ev_clientName')?.value || '') : '',
    clientPhone: isEvent ? (document.getElementById('ev_clientPhone')?.value || '') : '',
    address: isEvent ? (document.getElementById('ev_address')?.value || '') : '',
    photographerIds: Array.from(document.querySelectorAll('input[name="ev_photogs"]:checked')).map(cb => cb.value),
    packages: selectedPackages,
    equipmentRent: Array.from(document.querySelectorAll('.eq-row')).map(r => ({
      pId: r.querySelector('.eq-pid').value, name: r.querySelector('.eq-name').value, price: Number(r.querySelector('.eq-price').value || 0)
    })).filter(x => x.pId && x.name)
  };

  const idx = state.events.findIndex(e => e.id === id);
  if(idx >= 0) state.events[idx] = evData; else state.events.push(evData);

  saveData(); closeModal(); renderView(); showToast('تم حفظ العملية بنجاح', 'success');
}

            <p class="font-bold text-emerald-400 text-2xl">${formatMoney(allTimeStats.totalEarned)}</p>

function openPhotogModal(id = null) {

  const content = `
    <input type="hidden" id="p_id" value="${id||''}">
    <div class="space-y-5">
      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">الاسم</label><input type="text" id="p_name" value="${p.name}" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20"></div>
      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">رقم الهاتف (للواتساب)</label><input type="tel" id="p_phone" value="${p.phone}" class="w-full rounded-xl p-3.5 text-sm text-left focus:ring-2 focus:ring-primary-500/20" dir="ltr"></div>
      <div class="grid grid-cols-2 gap-5">
          <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">الأجر الافتراضي</label><input type="number" id="p_wage" value="${p.wage}" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20"></div>
          <div>
            <label class="block text-xs font-bold text-app-muted mb-2 uppercase">دورة القبض</label>
            <select id="p_payPeriod" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20">
              <option value="daily" ${p.payPeriod==='daily'?'selected':''}>يومي (بالأوردر)</option>
              <option value="weekly" ${p.payPeriod==='weekly'?'selected':''}>أسبوعي</option>
              <option value="monthly" ${p.payPeriod==='monthly'?'selected':''}>شهري</option>
            </select>
          </div>
      </div>
    </div>
  `;
  openModal(title, content, `<button onclick="closeModal()" class="px-6 py-3.5 rounded-xl font-bold text-white bg-app-surface border border-app-border hover:bg-app-hover transition-colors">إلغاء</button><button onclick="savePhotog()" class="px-8 py-3.5 rounded-xl font-bold btn-primary shadow-neon">حفظ البيانات</button>`);
}

function savePhotog() {
  const id = document.getElementById('p_id').value || generateId();
  const name = document.getElementById('p_name').value.trim();
  if(!name) return showToast('الاسم مطلوب', 'error');
  
  const data = { 
    id, name, 
    phone: document.getElementById('p_phone').value, 
    wage: Number(document.getElementById('p_wage').value),
    payPeriod: document.getElementById('p_payPeriod').value
  };
  
  const idx = state.photographers.findIndex(x => x.id === id);
  if(idx >= 0) state.photographers[idx] = data; else state.photographers.push(data);
  saveData(); closeModal(); renderView(); showToast('تم حفظ الفرد بنجاح');
}

function saveHall() {
  const id = document.getElementById('h_id').value || generateId();
  const name = document.getElementById('h_name').value.trim();
  if(!name) return showToast('الاسم مطلوب', 'error');
  const data = { id, name, defaultRevenue: Number(document.getElementById('h_defaultRev').value || 0) };
  const idx = state.halls.findIndex(x => x.id === id);
  if(idx >= 0) state.halls[idx] = data; else state.halls.push(data);
  saveData(); closeModal(); renderView(); showToast('تم حفظ الموقع بنجاح');
}

  const content = `

      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">المبلغ المدفوع (ج)</label><input type="number" id="pay_amount" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20 font-bold text-lg"></div>
      <div class="grid grid-cols-2 gap-4">
         <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">التاريخ</label><input type="date" id="pay_date" value="${new Date().toISOString().split('T')[0]}" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20"></div>
         <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">ملاحظات</label><input type="text" id="pay_desc" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20" placeholder="اختياري"></div>
      </div>
    </div>
  `;
  openModal('تسجيل سداد وتصفية', content, `<button onclick="closeModal()" class="px-6 py-3.5 rounded-xl font-bold text-white bg-app-surface border border-app-border hover:bg-app-hover">إلغاء</button><button onclick="savePayout()" class="px-8 py-3.5 rounded-xl font-bold btn-primary shadow-neon">تأكيد دفع الدفعة</button>`);
}

function updatePayoutBalance(pId) {
  const info = document.getElementById('pay_balance_info');
  if(!pId) { info.classList.add('hidden'); return; }
  
  const allTimeStats = getAllTimePhotographerStats(pId);
  document.getElementById('pay_balance_val').textContent = formatMoney(allTimeStats.overallRemaining);
  document.getElementById('pay_amount').value = allTimeStats.overallRemaining > 0 ? allTimeStats.overallRemaining : '';
  info.classList.remove('hidden');
}

function savePayout() {
  const pId = document.getElementById('pay_pid').value;
  const amount = Number(document.getElementById('pay_amount').value);
  const date = document.getElementById('pay_date').value;
  if(!pId || amount <= 0 || !date) return showToast('بيانات الدفعة غير صحيحة', 'error');
  state.expenses.push({ id: generateId(), type: 'payout', pId, amount, date, desc: document.getElementById('pay_desc').value });
  saveData(); closeModal(); renderView(); showToast('تم تسجيل الدفعة وخصمها بنجاح');
}

  const content = `
    <div class="space-y-5">
      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">مبلغ المصروف (ج)</label><input type="number" id="ex_amount" class="w-full rounded-xl p-4 text-xl font-bold text-red-400 bg-red-500/10 border-red-500/30 focus:border-red-500 focus:ring-2 focus:ring-red-500/20"></div>
      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">بيان المصروف</label><input type="text" id="ex_desc" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20" placeholder="مثال: كهرباء، مواصلات..."></div>
      <div><label class="block text-xs font-bold text-app-muted mb-2 uppercase">التاريخ</label><input type="date" id="ex_date" value="${new Date().toISOString().split('T')[0]}" class="w-full rounded-xl p-3.5 text-sm focus:ring-2 focus:ring-primary-500/20"></div>

  openModal('تسجيل مصروف جديد', content, `<button onclick="closeModal()" class="px-6 py-3.5 rounded-xl font-bold text-white bg-app-surface border border-app-border hover:bg-app-hover">إلغاء</button><button onclick="saveExpense()" class="px-8 py-3.5 rounded-xl font-bold bg-red-500 hover:bg-red-600 text-white shadow-md">تسجيل المصروف</button>`);

function saveExpense() {
   const amount = Number(document.getElementById('ex_amount').value), desc = document.getElementById('ex_desc').value, date = document.getElementById('ex_date').value;
   if(amount <= 0 || !date || !desc) return showToast('خطأ في البيانات', 'error');
   state.expenses.push({ id: generateId(), type: 'general', amount, date, desc });
   saveData(); closeModal(); renderView(); showToast('تم الحفظ', 'success');
}

function savePackage() {
  const id = document.getElementById('pkg_id').value || generateId();
  const name = document.getElementById('pkg_name').value;
  const supplierName = document.getElementById('pkg_supplierName').value;
  const clientPrice = Number(document.getElementById('pkg_clientPrice').value);
  const supplierCost = Number(document.getElementById('pkg_supplierCost').value);
  
  if(!name || clientPrice < 0 || supplierCost < 0) return showToast('بيانات الخدمة غير مكتملة', 'error');
  
  const pkgData = { id, name, supplierName, clientPrice, supplierCost };
  const idx = state.supplierPackages.findIndex(p => p.id === id);
  if (idx >= 0) state.supplierPackages[idx] = pkgData;
  else state.supplierPackages.push(pkgData);
  
  saveData(); closeModal(); renderSettings(document.getElementById('view-container')); showToast('تم حفظ بيانات الخدمة بنجاح');
}

function deletePackage(id) {
  state.supplierPackages = state.supplierPackages.filter(p => p.id !== id);
  saveData(); renderSettings(document.getElementById('view-container')); showToast('تم الحذف بنجاح');
}

function copyPortalLink(url) {
  const tempInput = document.createElement("input"); tempInput.value = url;
  document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
  showToast('تم نسخ رابط البوابة. يمكنك إرساله الآن.', 'success');
}

function processTemplate(template, data) {
  return template.replace(/{name}/g, data.name || '')
                 .replace(/{company}/g, data.company || '')
                 .replace(/{url}/g, data.url || '');
}

        <div class="bg-app-surface border border-app-border rounded-3xl p-5 shadow-sm hover:border-pink-500/30 transition-colors">
          <div class="flex justify-between items-start mb-3"><span class="text-2xl">🎁</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-1 uppercase">مكافآت وبدلات</p>
          <p class="text-xl font-bold text-pink-400">${formatMoney(statsMonth.bonusesTotal)}</p>
        </div>
        <div class="bg-app-surface border border-app-border rounded-3xl p-5 shadow-sm hover:border-red-500/30 transition-colors">
          <div class="flex justify-between items-start mb-3"><span class="text-2xl">💸</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-1 uppercase">دفعات مالية استلمتها</p>
          <p class="text-xl font-bold text-red-400">${formatMoney(statsMonth.payoutsThisMonth)}</p>
        </div>
      </div>

      <!-- Transaction Log -->
      <h3 class="font-bold text-xs text-app-muted mb-4 px-3 uppercase tracking-widest">سجل الحركات للشهر المحدد</h3>
      <div class="space-y-3">
        ${log.length === 0 ? '<div class="text-center bg-app-surface border border-dashed border-app-border rounded-3xl p-10 text-app-muted text-sm font-medium">لا توجد حركات مسجلة هذا الشهر.</div>' : ''}
        ${log.map(item => `
          <div class="bg-app-surface border border-app-border rounded-3xl p-5 flex items-center justify-between hover:border-primary-500/40 transition-all shadow-sm hover:-translate-y-1">
            <div class="flex gap-4 items-center">
              <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-sm border border-app-border ${item.type === 'payout' ? 'bg-red-500/10 text-red-400' : (item.type==='equip'?'bg-purple-500/10 text-purple-400' : (item.type==='bonus'?'bg-pink-500/10 text-pink-400' : 'bg-primary-500/10 text-primary-400'))}">
                ${item.type === 'work' ? '🎬' : (item.type === 'payout' ? '📉' : (item.type === 'equip' ? '📷' : '🎁'))}
              </div>
              <div>
                <h4 class="font-bold text-white text-sm mb-1">${item.title}</h4>
                <p class="text-[10px] font-medium text-app-muted bg-app-bg px-2 py-0.5 rounded border border-app-border inline-block">${formatDateAr(item.date)} • ${item.desc}</p>
              </div>
            </div>
            <div class="font-bold text-lg whitespace-nowrap bg-app-bg px-3.5 py-2 rounded-xl border border-app-border shadow-inner ${item.amount > 0 ? 'text-emerald-400' : 'text-red-400'}">
              ${item.amount > 0 ? '+' : ''}${formatMoney(item.amount)}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Start app
window.onload = initApp;
</script>
</body>
</html>
