<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="mobile-web-app-capable" content="yes">
<title>إدارة المصورين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c2033;--mut:#6b7190;--pri:#4f46e5;--pri2:#eef0ff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--bd:#e4e6f2;--wa:#25D366;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:800}
.gear{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:16px;position:relative}
nav{display:flex;gap:6px;margin-inline-start:auto}
nav button{background:rgba(255,255,255,.14);border:0;color:#fff;padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:center}
nav button small{font-size:inherit}
nav button.on{background:#fff;color:#312e81;font-weight:700}
main{max-width:1100px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;border:1px solid var(--bd)}
.stat small{color:var(--mut);display:block;margin-bottom:6px}
.stat b{font-size:20px;font-weight:800}
.stat.net{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;border:0}.stat.net small{color:#c7caff}
.bar{display:flex;gap:10px;align-items:center;margin:6px 0 14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:18px}
.sp{margin-inline-start:auto}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.d{background:#fee2e2;color:var(--bad)}
.btn.wa{background:var(--wa);color:#fff}
.btn.s{padding:6px 11px;font-size:13px;border-radius:9px}
.filters{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.filters .fld{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:15px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(79,70,229,.13);border-color:#c7caff}
.card.static{cursor:default}.card.static:hover{transform:none;box-shadow:none;border-color:var(--bd)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mut);font-size:13px;gap:6px}
.card h3{margin:0 0 10px;font-size:17px}
.row2{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:var(--mut);gap:8px}
.row2 b{color:var(--ink)}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.t-hall{background:#e0e7ff;color:#3730a3}.t-out{background:#ffedd5;color:#c2410c}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}
.empty{text-align:center;padding:50px 10px;color:var(--mut);background:#fff;border:2px dashed var(--bd);border-radius:var(--r)}
.rep{background:#fff;border:2px solid #c7caff;border-radius:var(--r);padding:14px;margin-bottom:16px}
.rep h3{margin:0 0 12px}
#modal{position:fixed;inset:0;background:rgba(20,22,40,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:20}
#modal.on{display:flex}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:660px;padding:20px;margin:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
#dlg{position:fixed;inset:0;background:rgba(20,22,40,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:40}
#dlg.on{display:flex}
.dbox{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:500px;max-height:92vh;overflow:auto}
.dbox h3{margin:0 0 12px;font-size:18px}
.sec{margin:16px 0 6px;font-weight:800;color:var(--pri)}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd);align-items:center}
.fld{display:grid;gap:5px;margin-bottom:10px}
.fld label{font-size:13px;color:var(--mut)}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;background:#fafaff;width:100%}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rows .row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px;margin-bottom:6px}
.rows button,.eqr button,.itr button{border:0;background:#fee2e2;color:var(--bad);border-radius:9px;padding:0 12px;cursor:pointer;min-height:40px}
.yn{display:flex;gap:8px}
.yn label{flex:1}
.yn input{display:none}
.yn span{display:block;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;background:#fafaff;font-weight:700}
.yn input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.phr{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;background:#fafaff}
.phr.on{border-color:var(--pri);background:var(--pri2)}
.phr label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.eqr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;padding:8px;border:1px dashed var(--bd);border-radius:12px}
.eqr .eq-n{grid-column:span 2}.eqr .eq-o{grid-column:span 3}.eqr .eq-i,.eqr button{grid-column:1/-1}
.itr{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.fl{display:flex;flex-wrap:wrap;gap:6px}
.fl label{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;cursor:pointer;background:#fafaff}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.link{direction:ltr;text-align:left;font-size:12px;background:#f3f4ff;border-radius:8px;padding:7px 9px;word-break:break-all;color:#3730a3;margin:8px 0}
.dev{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.dev.on{background:#dcfce7;color:#166534}.dev.off{background:#fef3c7;color:#92400e}
.center{max-width:420px;margin:60px auto;text-align:center;padding:0 16px}
.banner{background:#fef3c7;color:#92400e;padding:8px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1c2033;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;display:none;max-width:90vw;text-align:center}
.hint{color:var(--mut);font-size:13px}
.items{background:#f7f8ff;border-radius:10px;padding:6px 10px;margin:6px 0}
.items .row2{padding:2px 0;font-size:13px}

/* ===== الهاتف ===== */
@media(max-width:700px){
  body{font-size:16px}
  input,select,textarea{font-size:16px;padding:11px 12px}
  header{padding:12px 14px}
  header h1{font-size:17px}
  .gear.first{margin-inline-start:auto}
  main{padding:12px 12px 100px}
  nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;z-index:15;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav button{flex:1;flex-direction:column;gap:1px;background:transparent;color:var(--mut);padding:6px 2px;font-size:19px;border-radius:12px}
  nav button small{font-size:11px;font-weight:700}
  nav button.on{background:var(--pri2);color:var(--pri)}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat b{font-size:17px}
  .grid{grid-template-columns:1fr}
  .btn{padding:12px 16px}
  .btn.s{padding:8px 12px}
  #modal{padding:0;align-items:flex-end}
  .sheet{border-radius:22px 22px 0 0;max-height:94vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));margin:0}
  #dlg{align-items:flex-end;padding:0}
  .dbox{border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
  .two{grid-template-columns:1fr}
  .rows .row{grid-template-columns:1fr 1fr auto}
  .eqr{grid-template-columns:1fr 1fr}
  .eqr .eq-n{grid-column:1/-1}.eqr .eq-o{grid-column:auto}
  .itr{grid-template-columns:1fr 1fr}
  .itr .it-n,.itr button{grid-column:1/-1}
  .filters{grid-template-columns:1fr 1fr}
  .filters .full{grid-column:1/-1}
  .bar .sp{margin-inline-start:0;width:100%}
}

/* ===== الدردشة والإشعارات ===== */
nav button{position:relative}
.bdg{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 5px;line-height:19px;text-align:center}
.chatbox{display:flex;flex-direction:column;height:calc(100dvh - 210px);min-height:380px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f7f8ff}
.msg{max-width:86%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--bd);align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--pri2);border-color:#c7caff}
.msg .nm{font-weight:800;font-size:12px;color:var(--pri);margin-bottom:2px}
.msg .tm{font-size:11px;color:var(--mut);margin-top:3px}
.msg .mn{display:inline-block;background:#fef3c7;color:#92400e;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-bottom:3px}
.msg.swap{border:2px dashed #f59e0b;background:#fffbeb;max-width:94%}
.sysmsg{align-self:center;background:#e0e7ff;color:#3730a3;font-size:12px;border-radius:99px;padding:5px 14px;text-align:center}
.day{align-self:center;font-size:12px;color:var(--mut);padding:2px 10px}
.compose{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd);background:#fff;align-items:flex-end}
.compose select{width:auto;max-width:36%}
.compose textarea{resize:none;flex:1;max-height:110px}
.nt{padding:10px;border-bottom:1px solid var(--bd);border-radius:8px;cursor:pointer;line-height:1.6}
.nt.un{background:var(--pri2)}
.nt small{color:var(--mut)}
@media(max-width:700px){.chatbox{height:calc(100dvh - 225px)}.bdg{top:0;left:calc(50% - 22px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>
<div id="dlg" onclick="if(event.target===this)dClose(false)"><div class="dbox" id="dbox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ أدوات ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const tok=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
const money=n=>Number(n||0).toLocaleString('en-US')+' ج.م';
const norm=s=>String(s||'').replace(/\D/g,'');
const sum=a=>(a||[]).reduce((t,x)=>t+(+x.fee||+x.amount||+x.cost||0),0);
const sumK=(a,k)=>(a||[]).reduce((t,x)=>t+(+x[k]||0),0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)};
const typeName=t=>t==='hall'?'قاعة':'حفلة خارجية';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
const longDate=d=>new Date(d+'T00:00:00').toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const deviceId=(()=>{let d=localStorage.getItem('dev_id');if(!d){d=crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid();localStorage.setItem('dev_id',d)}return d})();
const base=location.href.split('#')[0].split('?')[0];
const qs=new URLSearchParams(location.search);
const fixDb=d=>{d=d||{};['photographers','events','flashes','halls','suppliers','withdrawals'].forEach(k=>d[k]=d[k]||[]);d.settings=d.settings||{};return d};
const biz=()=>db.settings.biz||'إدارة المصورين';

/* ============ نوافذ داخلية (بديل confirm/prompt/alert التي تُحجب في بعض المتصفحات) ============ */
let _dres=null;
function dOpen(html){$('#dbox').innerHTML=html;$('#dlg').classList.add('on')}
function dClose(v){$('#dlg').classList.remove('on');if(_dres){const r=_dres;_dres=null;r(v)}}
function ask(msg,okText='حذف',danger=true){return new Promise(res=>{if(_dres)_dres(false);_dres=res;
  dOpen(`<p style="font-size:16px;margin:0 0 6px;line-height:1.7">${esc(msg)}</p><div class="acts"><button class="btn ${danger?'d':''}" onclick="dClose(true)">${okText}</button><button class="btn g" onclick="dClose(false)">إلغاء</button></div>`)})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlg').classList.contains('on'))dClose(false);else closeM()}});
async function copyText(t,msg='تم النسخ'){
  try{await navigator.clipboard.writeText(t);toast(msg);return}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(ok){toast(msg);return}}catch(e){}
  dOpen(`<h3>انسخ النص</h3><textarea rows="5" readonly onfocus="this.select()">${esc(t)}</textarea><div class="acts"><button class="btn g" onclick="dClose()">إغلاق</button></div>`)}
function waNum(ph){let n=norm(ph);if(n.startsWith('00'))n=n.slice(2);else if(n.startsWith('0'))n='20'+n.slice(1);return n}
const waUrl=(ph,t)=>`https://wa.me/${waNum(ph)}?text=${encodeURIComponent(t)}`;
let _wa={};
function waPreview(title,phone,text){
  _wa={phone,text};
  dOpen(`<h3>${esc(title)}</h3><div class="hint" style="margin-bottom:6px">يمكنك تعديل الرسالة قبل الإرسال</div><textarea id="wa-t" rows="13" oninput="waSync()" style="line-height:1.8">${esc(text)}</textarea>
  <div class="acts"><a class="btn wa" id="wa-a" target="_blank" rel="noopener" href="${waUrl(phone,text)}">إرسال عبر واتساب</a><button class="btn g" onclick="copyText($('#wa-t').value)">نسخ</button><button class="btn g" onclick="dClose()">إغلاق</button></div>`)}
function waSync(){const t=$('#wa-t').value;_wa.text=t;$('#wa-a').href=waUrl(_wa.phone,t)}

/* ============ طبقة البيانات (سيرفر أو تجريبي محلي) ============ */
const API={mode:'local',pass:sessionStorage.getItem('adm')||'',
  async init(){try{const r=await fetch('/api/ping');if(r.ok&&(await r.json()).ok)this.mode='server'}catch(e){}},
  h(){return{'x-admin':this.pass,'Content-Type':'application/json'}},
  async load(){
    if(this.mode==='local')return fixDb(JSON.parse(localStorage.getItem('db')||'{}'));
    const r=await fetch('/api/db',{headers:this.h()});if(r.status===401||r.status===429)throw r.status;return fixDb(await r.json())},
  async save(d,notify=[]){
    if(this.mode==='local'){localStorage.setItem('db',JSON.stringify(d));return d}
    const r=await fetch('/api/db',{method:'PUT',headers:this.h(),body:JSON.stringify({...d,_notify:notify})});return fixDb(await r.json())},
  async resetDevice(id){
    if(this.mode==='local')return db;
    const r=await fetch('/api/reset-device',{method:'POST',headers:this.h(),body:JSON.stringify({id})});return fixDb(await r.json())},
  async me(p,k){
    if(this.mode==='server'){
      const r=await fetch(`/api/me?p=${encodeURIComponent(p)}&k=${encodeURIComponent(k)}&d=${deviceId}`);
      return {status:r.status,data:await r.json()}}
    const d=await this.load();
    const ph=d.photographers.find(x=>norm(x.phone)===norm(p)&&x.token===k);
    if(!ph)return{status:404,data:{}};
    const events=[],rent=[];
    d.events.forEach(e=>{
      const x=(e.photographers||[]).find(x=>x.pid===ph.id);if(x)events.push({date:e.date,type:e.type,venue:e.venue,fee:x.fee,paid:!!x.paid});
      (e.equipment||[]).forEach(q=>{if(q.source==='photographer'&&q.ownerId===ph.id)rent.push({date:e.date,venue:e.venue,label:q.label,cost:q.cost,paid:!!q.paid})})});
    events.sort((a,b)=>b.date.localeCompare(a.date));rent.sort((a,b)=>b.date.localeCompare(a.date));
    const withdrawals=d.withdrawals.filter(w=>w.pid===ph.id).map(w=>({date:w.date,amount:w.amount,note:w.note||''})).sort((a,b)=>b.date.localeCompare(a.date));
    return{status:200,data:{name:ph.name,phone:ph.phone,events,rent,withdrawals}}}
};

let db=fixDb(),view='home',filter='all',month='',fPh='',fHall='';

/* ============ حسابات ============ */
function calc(e){
  const base=+e.income||0,eqInc=sumK(e.equipment,'price'),exp=sum(e.expenses),fees=sum(e.photographers),rent=sum(e.equipment);
  const income=base+eqInc;
  return{base,eqInc,income,exp,fees,rent,net:income-exp-fees-rent}}
function totals(evs){return evs.reduce((t,e)=>{const c=calc(e);t.i+=c.income;t.x+=c.exp;t.f+=c.fees;t.r+=c.rent;t.n+=c.net;return t},{i:0,x:0,f:0,r:0,n:0})}
function flashState(f){for(const e of db.events){const x=(e.flashes||[]).find(x=>x.id===f.id&&!x.returned);if(x)return{out:true,ev:e}}return{out:false}}
function ownerName(q){const l=q.source==='supplier'?db.suppliers:q.source==='photographer'?db.photographers:[];return (l.find(o=>o.id===q.ownerId)||{name:'غير محدد'}).name}
/* wm: ''=كل السحوبات، 'YYYY-MM'=سحوبات الشهر، null=بدون سحوبات */
function phStats(pid,evs=db.events,wm=''){
  const f=[],r=[];
  evs.forEach(e=>{(e.photographers||[]).forEach(x=>x.pid===pid&&f.push({...x,e}));(e.equipment||[]).forEach(q=>q.source==='photographer'&&q.ownerId===pid&&r.push({...q,e}))});
  const w=wm===null?[]:db.withdrawals.filter(x=>x.pid===pid&&(!wm||x.date.startsWith(wm)));
  const fees=sum(f),rent=sum(r),paid=sum(f.filter(x=>x.paid))+sum(r.filter(x=>x.paid)),wd=sumK(w,'amount');
  return{f,r,w,wd,fees,rent,paid,total:fees+rent,collected:paid+wd,due:fees+rent-paid-wd}}
function supStats(sid){
  const r=[];db.events.forEach(e=>(e.equipment||[]).forEach(q=>q.source==='supplier'&&q.ownerId===sid&&r.push({...q,e})));
  const total=sumK(r,'cost'),client=sumK(r,'price'),paid=sumK(r.filter(x=>x.paid),'cost');
  return{r,total,client,margin:client-total,paid,due:total-paid}}
function filtered(){
  return db.events.filter(e=>(filter==='all'||e.type===filter)&&(!month||e.date.startsWith(month))
    &&(!fPh||(e.photographers||[]).some(x=>x.pid===fPh)||(e.equipment||[]).some(q=>q.source==='photographer'&&q.ownerId===fPh))
    &&(!fHall||e.hallId===fHall)).sort((a,b)=>b.date.localeCompare(a.date))}
/* إشعارات المصورين عند تسجيل/تعديل/حذف يومية: تُرسل مع الحفظ التالي */
let pendingNotify=[];
const queueNotify=(pids,text,ref='')=>{pids=(pids||[]).filter(Boolean);if(pids.length)pendingNotify.push({pids,text,ref})};
async function persist(){db=await API.save(db,pendingNotify.splice(0))}

/* ============ الدخول ============ */
async function boot(){
  await API.init();
  if(qs.get('p')&&qs.get('k'))return photographerView();

async function netPost(kind,b={}){
  try{
    const r=await fetch(PH?PH_EP[kind]:ADMIN_EP[kind],{method:'POST',headers:PH?{'Content-Type':'application/json'}:API.h(),
      body:JSON.stringify(PH?{...b,p:qs.get('p'),k:qs.get('k'),d:deviceId}:b)});

function applyFresh(d){

  else{if(d.chat){CH.chat=d.chat;CH.sig=sigOf(d.chat)}if(d.notifs)CH.notifs=d.notifs;if(d.db)db=fixDb(d.db)}

/* ---- الدردشة ---- */
const chatBox=roster=>`<div class="chatbox"><div class="msgs" id="msgs"></div><div class="compose"><select id="c-to" title="توجيه الرسالة"><option value="">📢 للجميع</option>${roster.map(r=>`<option value="${r.id}">@ ${esc(r.name)}</option>`).join('')}</select><textarea id="c-t" rows="1" placeholder="اكتب رسالة…" onkeydown="chatKey(event)"></textarea><button class="btn" onclick="sendMsg()">إرسال</button></div></div>`;
function chatTab(){

  return `<div class="bar"><h2>💬 مجموعة المصورين (${db.photographers.length+1})</h2><span class="hint">اختر @اسم لتوجيه الرسالة لمصور واحد فيصله الإشعار وحده</span></div>`+chatBox(ctx().roster)}
function chatKey(e){if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();sendMsg()}}
async function sendMsg(){
  const t=$('#c-t').value.trim();if(!t)return;const to=$('#c-to').value;$('#c-t').value='';
  const r=await netPost('send',{text:t,to});
  if(r.status!==200){$('#c-t').value=t;return toast(r.data.error||'تعذر الإرسال')}

const nameById=(id,c)=>id===c.me?'أنت':id==='admin'?'المدير':(c.roster.find(r=>r.id===id)||{name:'محذوف'}).name;
function msgHtml(m,c){
  if(m.kind==='system')return `<div class="sysmsg">${esc(m.text)}</div>`;
  const me=m.from===c.me;
  const mention=m.to&&m.kind!=='swap'?`<div class="mn">↩ ${m.to===c.me?'إليك':'إلى '+esc(nameById(m.to,c))}</div>`:'';
  const inner=m.kind==='swap'?swapCard(m,c):`<div>${esc(m.text).replace(/\n/g,'<br>')}</div>`;
  return `<div class="msg ${me?'me':''} ${m.kind==='swap'?'swap':''}"><div class="nm">${me?'أنت':esc(m.name)}${m.from==='admin'?' 👑':''}</div>${mention}${inner}<div class="tm">${hhmm(m.ts)}</div></div>`}
function paintMsgs(stick){
  const el=$('#msgs');if(!el)return;const c=ctx();
  const near=stick||el.scrollHeight-el.scrollTop-el.clientHeight<90;
  let last='',h='';
  c.chat.forEach(m=>{const d=dayLabel(m.ts);if(d!==last){h+=`<div class="day">${d}</div>`;last=d}h+=msgHtml(m,c)});
  el.innerHTML=h||'<div class="day">لا توجد رسائل بعد — ابدأ المحادثة 👋</div>';
  if(near)el.scrollTop=el.scrollHeight;
  if(!document.hidden)markRead('chat')}

/* ---- طلب الاستبدال (لدي عذر) ---- */
const SW={open:['🟡','مفتوح لأي مصور'],pending_peer:['🟡','بانتظار رد البديل'],pending_admin:['🟠','بانتظار اعتماد المدير'],approved:['🟢','تم الاعتماد'],declined:['🔴','اعتذر البديل'],rejected:['🔴','أُغلق من المدير'],cancelled:['⚪','أُلغي الطلب']};
function swapCard(m,c){
  const s=m.swap,[ic,lb]=SW[s.status]||['',''],active=['open','pending_peer','pending_admin'].includes(s.status);
  let acts='';
  if(c.admin){
    if(s.status==='pending_admin')acts=`<button class="btn s" onclick="swDecide('${m.id}',true)">✅ اعتماد</button><button class="btn d s" onclick="swDecide('${m.id}',false)">رفض</button>`;
    else if(active){
      const ev=db.events.find(e=>e.id===s.eventId),busy=new Set(((ev&&ev.photographers)||[]).map(x=>x.pid));
      acts=`<select id="sw-${m.id}" style="width:auto"><option value="">تعيين بديل…</option>${db.photographers.filter(p=>!busy.has(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn s" onclick="swAssign('${m.id}')">تعيين واعتماد</button><button class="btn d s" onclick="swDecide('${m.id}',false)">إغلاق</button>`}
  }else{
    if(s.fromPid===c.me&&active)acts=`<button class="btn d s" onclick="swCancel('${m.id}')">إلغاء الطلب</button>`;
    else if(s.status==='pending_peer'&&s.toPid===c.me)acts=`<button class="btn wa s" onclick="swRespond('${m.id}',true)">✅ موافق</button><button class="btn d s" onclick="swRespond('${m.id}',false)">اعتذار</button>`;
    else if(s.status==='open'&&s.fromPid!==c.me)acts=`<button class="btn wa s" onclick="swRespond('${m.id}',true)">🙋 أنا متاح</button>`}
  return `<div><b>🔄 طلب استبدال</b></div><div style="font-size:13px;line-height:1.8;margin-top:4px">👤 ${esc(s.fromName)} لديه عذر<br>📍 ${typeName(s.type)} «${esc(s.venue)}»<br>📅 ${esc(longDate(s.date))}${s.reason?`<br>📝 ${esc(s.reason)}`:''}<br>🔁 البديل: <b>${s.toName?esc(s.toName):'مفتوح لأي مصور'}</b>${s.note&&c.admin?`<br><span class="neg">${esc(s.note)}</span>`:''}</div><div style="margin:6px 0"><span class="dev ${s.status==='approved'?'on':'off'}">${ic} ${lb}</span></div>${acts?`<div class="acts" style="margin-top:6px">${acts}</div>`:''}`}
function swapForm(pre){
  const up=(PH.data.upcoming||[]).filter(e=>!e.pending);

  dOpen(`<h3>🔄 طلب استبدال (لدي عذر)</h3>
  <div class="fld"><label>الحفلة التي لن تستطيع حضورها</label><select id="sw-e">${up.map(e=>`<option value="${e.id}" ${e.id===pre?'selected':''}>${e.date} — ${esc(e.venue)}</option>`).join('')}</select></div>

function startAdminPoll(){

async function adminPoll(first){

    const fresh=d.notifs.filter(n=>!n.read&&!CH.seen.has(n.id));d.notifs.forEach(n=>CH.seen.add(n.id));
    const sig=sigOf(d.chat),changed=sig!==CH.sig;CH.chat=d.chat;CH.notifs=d.notifs;CH.sig=sig;

/* ---- تصدير CSV (يفتح في Excel) ---- */
function exportCsv(){
  const evs=filtered().reverse();
  if(!evs.length)return toast('لا توجد بيانات للتصدير');
  const nm=pid=>(db.photographers.find(p=>p.id===pid)||{name:'محذوف'}).name;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['التاريخ','النوع','المكان','الإيراد (شامل معدات العميل)','المصروفات','أجور المصورين','إيجار المعدات','الصافي','المصورون','المعدات المؤجرة','الفلاشات']];
  evs.forEach(e=>{const c=calc(e);rows.push([e.date,typeName(e.type),e.venue,c.income,c.exp,c.fees,c.rent,c.net,
    (e.photographers||[]).map(x=>nm(x.pid)+' ('+x.fee+')').join(' + '),
    (e.equipment||[]).map(x=>x.label+' - '+ownerName(x)+' (تكلفة '+x.cost+' / عميل '+(x.price||0)+')').join(' + '),
    (e.flashes||[]).map(x=>(db.flashes.find(f=>f.id===x.id)||{}).name).filter(Boolean).join(' + ')])});
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='تقرير-'+(month||'الكل')+'.csv';a.click();
}

async function saveEv(id){
  const old=id?db.events.find(x=>x.id===id):null;
  const type=$('#f-type').value,date=$('#f-date').value;
  let hallId='',venue='';
  if(type==='hall'){hallId=$('#f-hall').value;const h=db.halls.find(h=>h.id===hallId);if(!h)return toast('اختر القاعة');venue=h.name}
  else{venue=$('#f-venue').value.trim();if(!venue)return toast('أدخل مكان الحفلة')}
  if(!date)return toast('حدد التاريخ');
  const photographers=$$('.pc:checked').map(c=>({pid:c.value,fee:+c.closest('.phr').querySelector('.pf').value||0,paid:c.dataset.paid==='1'}));
  if(!photographers.length)return toast('حدد المصورين الذين عملوا');
  const fl=ynVal('fl'),eq=ynVal('eq');
  if(fl===null)return toast('أجب: هل استُخدمت فلاشة؟');
  if(eq===null)return toast('أجب: هل يوجد إيجار معدات؟');
  const flashes=fl?$$('#fl-box input:checked').map(c=>{const o=old&&(old.flashes||[]).find(x=>x.id===c.value);return{id:c.value,returned:o?o.returned:false}}):[];
  if(fl&&!flashes.length)return toast('حدد الفلاشة المستخدمة');
  let equipment=[];
  if(eq){
    for(const r of $$('.eqr')){
      const label=r.querySelector('.eq-n').value.trim(),cost=+r.querySelector('.eq-c').value||0,price=+r.querySelector('.eq-p').value||0,source=r.querySelector('.eq-s').value,o=r.querySelector('.eq-o');
      if(!label&&!cost&&!price)continue;
      if(!label||!cost)return toast('أكمل اسم المعدة وسعر المورد/الإيجار');
      if(!o.value||o.value==='__new')return toast('حدد '+(source==='supplier'?'المورد':'المصور')+' صاحب المعدة «'+label+'»');
      equipment.push({label,cost,price,source,ownerId:o.value,paid:o.dataset.paid==='1'})}
    if(!equipment.length)return toast('أضف المعدة المؤجرة أو اختر "لا"')}
  const rows=$$('#rows-ex .row').map(r=>{const i=r.querySelectorAll('input');return{label:i[0].value.trim(),amount:+i[1].value||0}}).filter(x=>x.label||x.amount);
  const e={id:id||uid(),type,hallId,venue,date,income:+$('#f-income').value||0,notes:$('#f-notes').value.trim(),photographers,expenses:rows,equipment,flashes};
  const oldIds=old?(old.photographers||[]).map(x=>x.pid):[],newIds=photographers.map(x=>x.pid);
  const added=newIds.filter(x=>!oldIds.includes(x)),removed=oldIds.filter(x=>!newIds.includes(x)),kept=newIds.filter(x=>oldIds.includes(x));
  queueNotify(added,`📌 تم اختيارك في ${typeName(type)} «${venue}» يوم ${date}`,e.id);
  queueNotify(removed,`❌ تم إلغاء إسنادك من «${old?old.venue:venue}» يوم ${old?old.date:date}`,e.id);
  if(old&&(old.date!==date||old.venue!==venue))queueNotify(kept,`✏️ تم تعديل موعد/مكان حفلتك: «${venue}» يوم ${date}`,e.id);
  if(id)db.events=db.events.map(x=>x.id===id?e:x);else db.events.push(e);
  await persist();closeM();render();toast('تم الحفظ')}

    if(!n)return toast('أدخل اسم المعدة');
    if(!c)return toast('أدخل سعر المورد للمعدة «'+n+'»');
    items.push({id:r.dataset.id||uid(),name:n,cost:c,price:p})}
  if(id)Object.assign(db.suppliers.find(x=>x.id===id),{name,phone,items});else db.suppliers.push({id:uid(),name,phone,items});
  await persist();closeM();render();toast('تم الحفظ')}
async function delSup(id){
  const s=db.suppliers.find(x=>x.id===id),n=supStats(id).r.length;
  if(!await ask(`حذف المورد «${s.name}»؟${n?` له ${n} معدة مؤجرة مسجلة في اليوميات وستظهر باسم «غير محدد».`:''}`))return;
  db.suppliers=db.suppliers.filter(x=>x.id!==id);await persist();render();toast('تم حذف المورد')}

/* ---- تذكير المورد (بدون أي مبالغ) ---- */
function remindForm(id){
  const s=db.suppliers.find(x=>x.id===id);
  if(norm(s.phone).length<8)return toast('أضف رقم هاتف المورد أولًا (تعديل)');
  dOpen(`<h3>🔔 تذكير المورد: ${esc(s.name)}</h3>
  <div class="two"><div class="fld"><label>تاريخ العمل</label><input id="r-d" type="date" value="${addDays(1)}"></div><div class="fld"><label>الوقت (اختياري)</label><input id="r-t" type="time"></div></div>
  <div class="fld"><label>المكان (اختياري)</label><input id="r-p" placeholder="مثال: قاعة النخيل"></div>
  ${(s.items||[]).length?`<div class="sec" style="margin-top:4px">المعدات المطلوبة</div><div class="fl" id="r-items">${s.items.map(i=>`<label><input type="checkbox" value="${esc(i.name)}" checked> ${esc(i.name)}</label>`).join('')}</div>`:''}
  <div class="fld" style="margin-top:10px"><label>ملاحظات (اختياري)</label><textarea id="r-n" rows="2"></textarea></div>
  <p class="hint">الرسالة لا تتضمن أي مبالغ.</p>
  <div class="acts"><button class="btn wa" onclick="remindGo('${id}')">معاينة وإرسال</button><button class="btn g" onclick="dClose()">إلغاء</button></div>`)}
function remindGo(id){
  const s=db.suppliers.find(x=>x.id===id),d=$('#r-d').value;if(!d)return toast('حدد تاريخ العمل');
  const t=$('#r-t').value,pl=$('#r-p').value.trim(),n=$('#r-n').value.trim(),items=$$('#r-items input:checked').map(c=>c.value),bar='━━━━━━━━━━━━━━';
  const L=['🔔 *تذكير بموعد عمل*',bar,'السلام عليكم ورحمة الله وبركاته',`الأستاذ/ *${s.name}* المحترم،`,'','نذكّركم بموعد العمل التالي:',`📅 *التاريخ:* ${longDate(d)}`];
  if(t)L.push(`⏰ *الوقت:* ${t}`);
  if(pl)L.push(`📍 *المكان:* ${pl}`);
  if(items.length){L.push('🧰 *المعدات المطلوبة:*');items.forEach(i=>L.push(`   • ${i}`))}
  if(n)L.push(`📝 *ملاحظات:* ${n}`);
  L.push(bar,'نرجو تجهيز المعدات بحالة ممتازة والتواجد قبل الموعد بوقت كافٍ، وتأكيد استلام هذا التذكير بالرد على الرسالة.','شكرًا لتعاونكم 🙏',`— ${biz()}`);
  waPreview('🔔 تذكير '+s.name,s.phone,L.join('\n'))}

/* ============ الفلاشات ============ */
function flashes(){
  const out=db.flashes.filter(f=>flashState(f).out).length;
  return `<div class="stats"><div class="stat"><small>إجمالي الفلاشات</small><b>${db.flashes.length}</b></div><div class="stat"><small>متاحة</small><b class="pos">${db.flashes.length-out}</b></div><div class="stat"><small>خارجة مع حفلات</small><b class="${out?'neg':''}">${out}</b></div></div>
  <div class="bar"><h2>الفلاشات</h2><button class="btn sp" onclick="flForm()">+ إضافة فلاشة</button></div>
  ${db.flashes.length?`<div class="grid">${db.flashes.map(f=>{const s=flashState(f);return `<div class="card static"><div class="top"><span>💾 ${esc(f.note||'')}</span><span class="dev ${s.out?'off':'on'}">${s.out?'خارجة':'متاحة'}</span></div><h3>${esc(f.name)}</h3>
  ${s.out?`<div class="row2"><span>مع حفلة</span><b>${esc(s.ev.venue)}</b></div><div class="row2"><span>التاريخ</span><b>${s.ev.date}</b></div><div class="acts"><button class="btn s" onclick="retFl('${f.id}')">تم الاستلام</button></div>`:''}
  <div class="acts" style="margin-top:6px"><button class="btn d s" onclick="delFl('${f.id}')">حذف</button></div></div>`}).join('')}</div>`:'<div class="empty">لم تضف فلاشات بعد</div>'}`}
function flForm(){$('#sheet').innerHTML=`<h2>إضافة فلاشة</h2><div class="fld"><label>الاسم / الرقم</label><input id="fl-name" placeholder="فلاشة 1"></div><div class="fld"><label>ملاحظة (السعة مثلًا)</label><input id="fl-note" placeholder="64GB"></div><div class="acts"><button class="btn" onclick="saveFl()">إضافة</button><button class="btn g" onclick="closeM()">إلغاء</button></div>`;$('#modal').classList.add('on')}
async function saveFl(){const name=$('#fl-name').value.trim();if(!name)return toast('أدخل اسم الفلاشة');db.flashes.push({id:uid(),name,note:$('#fl-note').value.trim()});await persist();closeM();render()}
async function retFl(id){db.events.forEach(e=>(e.flashes||[]).forEach(x=>{if(x.id===id)x.returned=true}));await persist();render();toast('تم استلام الفلاشة')}
async function delFl(id){
  const f=db.flashes.find(x=>x.id===id);
  if(!await ask(`حذف الفلاشة «${f.name}»؟`))return;
  db.flashes=db.flashes.filter(x=>x.id!==id);await persist();render();toast('تم حذف الفلاشة')}
