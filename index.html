<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لقطة برو | الإدارة الذكية للاستوديوهات</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Alexandria', 'sans-serif'] },
        colors: {
          app: {
            bg: '#09090b',       // Zinc 950
            surface: '#18181b',  // Zinc 900
            card: '#1f2024',
            border: '#27272a',   // Zinc 800
            hover: '#27272a',
            text: '#e4e4e7',
            muted: '#a1a1aa'
          },
          primary: {
            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' // Electric Blue
          },
          accent: {
            500: '#8b5cf6' // Violet
          }
        },
        boxShadow: {
          'neon': '0 0 20px rgba(59, 130, 246, 0.3)',
          'card': '0 4px 20px rgba(0, 0, 0, 0.4)'
        }
      }
    }
  }
</script>

<style>
  body { 
    background-color: #09090b; 
    color: #e4e4e7; 
    -webkit-font-smoothing: antialiased; 
    background-image: 
      radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #52525b; }

  /* UI Elements */
  .glass-card {
    background: rgba(31, 32, 36, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.3);
  }

  .interactive-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .interactive-card:hover {
    transform: translateY(-3px);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
  }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    transition: all 0.2s;
  }
  .btn-primary:hover { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(1px); }

  /* Inputs */
  input, select, textarea {
    background-color: rgba(24, 24, 27, 0.8) !important;
    border: 1px solid #27272a !important;
    color: #e4e4e7 !important;
    transition: all 0.2s;
    color-scheme: dark;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #3b82f6 !important;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
    outline: none !important;
  }

  /* Animations */
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-fade-in { animation: fadeIn 0.3s ease forwards; }

  /* Sidebar transitions */
  #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  
  /* Portal Mode (Mobile First) */
  .mode-portal body { background-image: none; background-color: #000; }
  .mode-portal #sidebar, .mode-portal #topbar { display: none !important; }
  .mode-portal #main-content { margin: 0 !important; padding: 0 !important; width: 100%; }

  /* Mobile tweaks */
  @media (max-width: 768px) {
    #main-content { margin-right: 0 !important; }
  }
</style>
</head>
<body class="flex" id="body-root">

<div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden animate-fade-in"></div>

<aside id="sidebar" class="fixed top-0 right-0 h-screen w-72 bg-app-surface/95 backdrop-blur-xl border-l border-app-border z-50 flex flex-col transform translate-x-full md:translate-x-0">
  
  <div class="p-6 border-b border-app-border flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-xl shadow-neon">L</div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">لقطة برو</h1>
        <p class="text-[10px] text-primary-400 font-medium tracking-wide uppercase">Studio Management</p>
      </div>
    </div>
    <button onclick="toggleSidebar()" class="md:hidden text-app-muted hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>

  <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto" id="nav-menu">
    <!-- Nav items generated dynamically -->
  </nav>

  <div class="p-5 border-t border-app-border bg-black/20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-app-card flex items-center justify-center text-xs border border-app-border">⚙️</div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold truncate text-white" id="sidebar-studio-name">الاستوديو</p>
        <p class="text-[10px] text-app-muted truncate">نسخة مُرخصة | المحدثة</p>
      </div>
    </div>
  </div>
</aside>

<main id="main-content" class="flex-1 mr-0 md:mr-72 min-w-0 flex flex-col min-h-screen transition-all duration-300">
  
  <header id="topbar" class="h-16 md:h-20 glass-card sticky top-0 z-30 flex items-center justify-between px-4 md:px-8 border-b border-app-border/50">
    <div class="flex items-center gap-4">
      <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 text-app-muted hover:text-white rounded-lg hover:bg-app-hover">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <h2 id="header-title" class="font-bold text-lg md:text-xl text-white hidden sm:block">الرئيسية</h2>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- زر البحث الشامل الجديد -->
      <button onclick="openGlobalSearch()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-app-surface border border-app-border hover:bg-app-hover text-white transition-colors shadow-sm relative group" title="بحث في النظام">
        <span>🔍</span>
      </button>

      <div class="flex items-center gap-2 bg-app-bg border border-app-border rounded-xl p-1 shadow-inner">
        <button onclick="shiftMonth(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted hover:text-white transition-colors">&lt;</button>
        <input type="month" id="global-month" onchange="onMonthChange(this.value)" class="bg-transparent border-none text-sm font-bold text-primary-400 outline-none px-2 cursor-pointer !shadow-none !border-transparent">
        <button onclick="shiftMonth(1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted hover:text-white transition-colors">&gt;</button>
      </div>
    </div>
  </header>

  <div class="p-4 md:p-8 flex-1" id="view-container">
    <!-- Views injected here -->
  </div>
</main>

<div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
  <div id="modal-content" class="bg-app-surface border border-app-border rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-300 overflow-hidden">
    <!-- Modal content -->
  </div>
</div>

<div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 z-[110] flex flex-col gap-2 w-[90%] md:w-auto max-w-sm pointer-events-none"></div>

<script>
const DB_KEY = 'laqta_saas_v4'; // Incremented version for new features

// Default Message Templates
const defaultMsgs = {
  reminder: "مرحباً {name} 🎬\nتذكير بموعد تصوير غداً إن شاء الله.\nالرجاء الالتزام بالموعد.\n\n{company}",
  cancel: "مرحباً {name}\nيرجى العلم بأنه تم إلغاء/تأجيل أوردر التصوير.\nسنوافيك بالتفاصيل.\n\n{company}",
  portal: "مرحباً {name} 🌟\nرابط بوابتك لمتابعة مواعيدك ومستحقاتك:\n{url}\n\nيُرجى الاحتفاظ به.\n{company}",
  thanks: "مرحباً {name} 🌸\nشكراً لمجهودك الرائع في عمل اليوم.\n\n{company}",
  payment: "مرحباً {name} 💰\nمستحقاتك المالية جاهزة للاستلام، يرجى التواصل أو الحضور للاستلام.\n\n{company}"
};

let state = {
  settings: { 
    companyName: 'استوديو لقطة', 
    phone: '',
    flashStock: 50,      // Default flash drives stock
    flashPrice: 150,     // Default flash drive price
    msgs: { ...defaultMsgs }
  },
  photographers: [],
  halls: [],
  inventory: [],
  events: [],
  expenses: [],
  supplierPackages: [],
  portalLogs: [] // <--- إضافة مصفوفة التتبع الجديدة
};

let currentMonth = new Date().toISOString().slice(0, 7);
let currentView = 'dashboard';
let isPortalMode = false;
let portalPhotographerId = null;
let currentPortalSessionId = null; // <--- متغير لتتبع الجلسة الحالية

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PAY_PERIODS = {
    'daily': { label: 'يومي', color: 'text-amber-400 bg-amber-500/10 border-amber-500/20' },
    'weekly': { label: 'أسبوعي', color: 'text-primary-400 bg-primary-500/10 border-primary-500/20' },
    'monthly': { label: 'شهري', color: 'text-purple-400 bg-purple-500/10 border-purple-500/20' }
};

const navItems = [
  { id: 'dashboard', icon: '📊', label: 'لوحة القيادة' },
  { id: 'events', icon: '🎬', label: 'أرشيف الأعمال' },
  { id: 'team', icon: '👥', label: 'الفريق والموارد' },
  { id: 'expenses', icon: '💸', label: 'الماليات والتصفيات' },
  { id: 'inventory', icon: '📦', label: 'المخزن والعهد' },
  { id: 'settings', icon: '⚙️', label: 'إعدادات النظام' }
];

function initApp() {
  loadData();
  
  // Ensure new state properties exist for backward compatibility
  if (!state.settings.msgs) state.settings.msgs = { ...defaultMsgs };
  if (state.settings.flashStock === undefined) state.settings.flashStock = 0;
  if (state.settings.flashPrice === undefined) state.settings.flashPrice = 0;
  if (!state.supplierPackages) state.supplierPackages = []; 
  if (!state.portalLogs) state.portalLogs = []; // <--- ضمان وجود سجل التتبع

  renderNav();
  document.getElementById('sidebar-studio-name').textContent = state.settings.companyName || 'استوديو لقطة';
  
  const params = new URLSearchParams(window.location.search);
  const phoneParam = params.get('p');
  
  if (phoneParam) {
    const p = state.photographers.find(x => formatPhone(x.phone) === formatPhone(phoneParam));
    if (p) {
      isPortalMode = true; portalPhotographerId = p.id;
      document.body.classList.add('mode-portal');
      renderPortalView();

      recordPortalActivity('login');
      window.addEventListener('beforeunload', () => recordPortalActivity('logout'));
      document.addEventListener('visibilitychange', () => {
        // تسجيل خروج إذا قام بتصغير التطبيق أو قفل شاشة الهاتف
        if (document.visibilityState === 'hidden') recordPortalActivity('logout');
        // تسجيل عودة واستكمال إذا قام بفتح الشاشة مرة أخرى
        else if (document.visibilityState === 'visible') recordPortalActivity('resume');
      });

    } else {
      document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-black p-4"><div class="glass-card p-8 rounded-2xl text-center border-red-500/30"><h2 class="text-2xl font-bold text-red-500 mb-3">ACCESS DENIED</h2><p class="text-app-muted">الرابط غير صالح أو تم إزالة صلاحيتك.</p></div></div>`;
    }
  } else {
    document.getElementById('global-month').value = currentMonth;
    nav('dashboard');

    window.addEventListener('storage', (e) => {
      if (e.key === DB_KEY && !isPortalMode) {
        const oldState = JSON.parse(e.oldValue || '{}');
        const newState = JSON.parse(e.newValue || '{}');
        const oldLogs = oldState.portalLogs || [];
        const newLogs = newState.portalLogs || [];
        
        // استشعار دخول جديد
        if (newLogs.length > oldLogs.length) {
          const latest = newLogs[newLogs.length - 1];
          const p = newState.photographers.find(x => x.id === latest.pId);
          if (p && !latest.logoutTime) showToast(`👁️ المصور ${p.name} يتصفح الرابط الخاص به الآن!`, 'success');
        } 
        // استشعار خروج أو إغلاق التطبيق
        else if (newLogs.length === oldLogs.length && newLogs.length > 0) {
          const lastOld = oldLogs[oldLogs.length - 1];
          const lastNew = newLogs[newLogs.length - 1];
          if (!lastOld.logoutTime && lastNew.logoutTime) {
            const p = newState.photographers.find(x => x.id === lastNew.pId);
            // إظهار رسالة الخروج بلون تحذيري (أحمر)
            if (p) showToast(`🚪 المصور ${p.name} قام بإغلاق بوابته أو تصغيرها.`, 'error');
          }
        }
        
        state = newState; // تحديث حالة النظام فوراً
      }
    });
  }
}

function recordPortalActivity(type) {
  if (!portalPhotographerId) return;
  if (!state.portalLogs) state.portalLogs = [];

  if (type === 'login') {
    currentPortalSessionId = generateId();
    state.portalLogs.push({ id: currentPortalSessionId, pId: portalPhotographerId, loginTime: new Date().toISOString(), logoutTime: null });
    saveData();
  } else if (type === 'logout' && currentPortalSessionId) {
    const session = state.portalLogs.find(x => x.id === currentPortalSessionId);
    if (session && !session.logoutTime) {
      session.logoutTime = new Date().toISOString();
      saveData();
    }
  } else if (type === 'resume' && currentPortalSessionId) {
    const session = state.portalLogs.find(x => x.id === currentPortalSessionId);
    if (session && session.logoutTime) {
      session.logoutTime = null; // إزالة وقت الخروج ليعود متصلاً
      saveData();
    }
  }
}

const formatTime = (iso) => {
  if(!iso) return '<span class="text-emerald-400 font-bold animate-pulse text-[10px] bg-emerald-500/10 px-2 py-0.5 rounded">متصل الآن</span>';
  return new Date(iso).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true});
};

const generateId = () => Math.random().toString(36).substr(2, 9);
const formatMoney = (num) => Number(num || 0).toLocaleString('en-US') + ' ج';
const formatDateAr = (dateStr) => {
  if(!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return `${d} ${MONTHS_AR[parseInt(m)-1]} ${y}`;
};
const getInitials = (name) => name ? name.trim().charAt(0) : '?';
const formatPhone = (phone) => {
  let p = (phone || '').replace(/\D/g, '');
  if (p.startsWith('0')) p = '20' + p.substring(1);
  return p;
};

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobile-overlay');
  sidebar.classList.toggle('translate-x-full');
  overlay.classList.toggle('hidden');
}

function loadData() {
  const saved = localStorage.getItem(DB_KEY);
  if (saved) { try { state = { ...state, ...JSON.parse(saved) }; } catch(e) {} }
}
function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(state)); }

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const isOk = type === 'success';
  toast.className = `glass-card border-l-4 ${isOk ? 'border-l-primary-500' : 'border-l-red-500'} p-4 rounded-xl flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300`;
  toast.innerHTML = `
    <div class="w-8 h-8 rounded-full flex items-center justify-center ${isOk ? 'bg-primary-500/20 text-primary-400' : 'bg-red-500/20 text-red-400'}">
      ${isOk ? '✓' : '✕'}
    </div>
    <p class="text-sm font-medium text-white flex-1">${message}</p>
  `;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
  setTimeout(() => {
    toast.classList.add('translate-y-10', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function openModal(title, contentHtml, footerHtml = '') {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  
  content.innerHTML = `
    <div class="px-6 py-5 border-b border-app-border flex justify-between items-center bg-app-surface">
      <h3 class="font-bold text-lg text-white">${title}</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted hover:text-white transition-colors">&times;</button>
    </div>
    <div class="p-6 overflow-y-auto bg-app-bg" style="max-height: calc(90vh - 140px);">
      ${contentHtml}
    </div>
    ${footerHtml ? `<div class="px-6 py-4 border-t border-app-border bg-app-surface flex flex-wrap-reverse justify-end gap-3">${footerHtml}</div>` : ''}
  `;
  
  backdrop.classList.remove('hidden'); backdrop.classList.add('flex');
  requestAnimationFrame(() => { backdrop.classList.remove('opacity-0'); content.classList.remove('scale-95'); });
}

function closeModal() {
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  backdrop.classList.add('opacity-0'); content.classList.add('scale-95');
  setTimeout(() => { backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); }, 300);
}

function renderNav() {
  const menu = document.getElementById('nav-menu');
  menu.innerHTML = navItems.map(item => `
    <button onclick="nav('${item.id}')" id="nav-${item.id}" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-app-muted hover:bg-app-hover hover:text-white transition-all duration-200 text-sm font-medium">
      <span class="text-lg opacity-80">${item.icon}</span>
      <span>${item.label}</span>
    </button>
  `).join('');
}

function nav(viewId) {
  if(isPortalMode) return;
  currentView = viewId;
  
  if(window.innerWidth < 768) toggleSidebar();
  
  document.querySelectorAll('#nav-menu button').forEach(btn => {
    if(btn.id === `nav-${viewId}`) {
      btn.classList.add('bg-primary-500/10', 'text-primary-400');
      btn.classList.remove('text-app-muted', 'hover:bg-app-hover', 'hover:text-white');
    } else {
      btn.classList.remove('bg-primary-500/10', 'text-primary-400');
      btn.classList.add('text-app-muted', 'hover:bg-app-hover', 'hover:text-white');
    }
  });

  const titleMap = navItems.reduce((acc, item) => ({...acc, [item.id]: item.label}), {});
  document.getElementById('header-title').textContent = titleMap[viewId];
  renderView();
}

// Global Search Feature
function openGlobalSearch() {
  const content = `
    <div class="relative mb-4">
      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-app-muted text-lg">🔍</span>
      <input type="text" id="global_search_input" oninput="performGlobalSearch(this.value)" placeholder="ابحث عن عميل، هاتف، مصور، أو مورد..." class="w-full bg-app-bg border border-app-border rounded-xl py-3 pr-12 pl-4 text-white focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all outline-none text-sm font-medium">
    </div>
    <div id="global_search_results" class="space-y-2 overflow-y-auto pr-1" style="max-height: 40vh;">
      <div class="text-center text-app-muted py-10 flex flex-col items-center justify-center gap-3">
        <span class="text-4xl opacity-50">⌨️</span>
        <p class="text-sm">ابدأ الكتابة للبحث في جميع السجلات</p>
      </div>
    </div>
  `;
  openModal('البحث الشامل', content);
  // Auto focus after modal animation
  setTimeout(() => {
    const input = document.getElementById('global_search_input');
    if(input) input.focus();
  }, 350);
}

function performGlobalSearch(query) {
  const resultsContainer = document.getElementById('global_search_results');
  if(!query || query.trim() === '') {
    resultsContainer.innerHTML = `<div class="text-center text-app-muted py-10 text-sm">ابدأ الكتابة للبحث في جميع السجلات</div>`;
    return;
  }
  
  query = query.toLowerCase().trim();
  let results = [];

  // 1. Search Clients in Events
  state.events.forEach(e => {
    if (
        (e.clientName && e.clientName.toLowerCase().includes(query)) || 
        (e.clientPhone && e.clientPhone.includes(query)) ||
        (e.address && e.address.toLowerCase().includes(query))
       ) {
        results.push({ type: 'client', data: e });
    }
  });

  // 2. Search Photographers
  state.photographers.forEach(p => {
    if ((p.name && p.name.toLowerCase().includes(query)) || (p.phone && p.phone.includes(query))) {
        results.push({ type: 'photog', data: p });
    }
  });

  // 3. Search Suppliers / Packages
  state.supplierPackages.forEach(pkg => {
    if (
        (pkg.name && pkg.name.toLowerCase().includes(query)) || 
        (pkg.supplierName && pkg.supplierName.toLowerCase().includes(query))
       ) {
        results.push({ type: 'supplier', data: pkg });
    }
  });

  // Render Results
  if (results.length === 0) {
      resultsContainer.innerHTML = `<div class="text-center text-red-400 py-10 text-sm">لا توجد نتائج مطابقة لـ "${query}"</div>`;
      return;
  }

  resultsContainer.innerHTML = results.map(res => {
      if (res.type === 'client') {
          const e = res.data;
          const hName = state.halls.find(x => x.id === e.hallId)?.name || 'موقع خارجي';
          return `

              </div>

            </div>

      } else if (res.type === 'photog') {
          const p = res.data;
          return `
            <div onclick="closeModal(); setTimeout(()=>openPhotogDetailsModal('${p.id}'), 300)" class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-amber-500/50 hover:bg-app-hover transition-colors cursor-pointer flex justify-between items-center group">

}


function shiftMonth(delta) {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  document.getElementById('global-month').value = currentMonth;
  if(isPortalMode) renderPortalView(); else renderView();
}
function onMonthChange(val) { if (val) { currentMonth = val; if(isPortalMode) renderPortalView(); else renderView(); } }

function getEventsForMonth(month) { return state.events.filter(e => e.date.startsWith(month)); }

// Monthly Stats
function getPhotographerStats(pId, month) {
  const events = getEventsForMonth(month).filter(e => (e.photographerIds || []).includes(pId));
  const p = state.photographers.find(x => x.id === pId) || { wage: 0 };
  
  let days = events.length; 
  let baseWageTotal = days * Number(p.wage);
  let equipmentTotal = 0;
  let bonusesTotal = 0;
  
  events.forEach(e => {
    (e.equipmentRent || []).filter(eq => eq.pId === pId).forEach(eq => equipmentTotal += Number(eq.price));
    (e.bonuses || []).filter(b => b.pId === pId).forEach(b => bonusesTotal += Number(b.amount));
  });

  const payoutsThisMonth = state.expenses.filter(ex => ex.type === 'payout' && ex.pId === pId && ex.date.startsWith(month))
                                        .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const totalEarned = baseWageTotal + equipmentTotal + bonusesTotal;
  
  return { events, days, baseWageTotal, equipmentTotal, bonusesTotal, totalEarned, payoutsThisMonth, remainingDue: totalEarned - payoutsThisMonth };
}

// All-time Stats
function getAllTimePhotographerStats(pId) {
  let totalEarned = 0;
  let totalPaid = 0;
  
  state.events.forEach(e => {
      if((e.photographerIds || []).includes(pId)) {
          const p = state.photographers.find(x => x.id === pId) || { wage: 0 };
          totalEarned += Number(p.wage);
          (e.equipmentRent || []).filter(eq => eq.pId === pId).forEach(eq => totalEarned += Number(eq.price));
          (e.bonuses || []).filter(b => b.pId === pId).forEach(b => totalEarned += Number(b.amount));
      }
  });
  
  state.expenses.forEach(ex => {
      if (ex.type === 'payout' && ex.pId === pId) {
          totalPaid += Number(ex.amount);
      }
  });

  return { totalEarned, totalPaid, overallRemaining: totalEarned - totalPaid };
}

function getDashboardStats(month) {
  const events = getEventsForMonth(month);
  let revenue = 0, equipmentRentTotal = 0, supplierCostsTotal = 0, totalDiscounts = 0;
  
  events.forEach(e => {
    const baseRev = Number(e.revenue || 0);
    const discount = Number(e.discount || 0);
    const pkgClient = (e.packages || []).reduce((s, p) => s + Number(p.clientPrice), 0);
    const pkgSupplier = (e.packages || []).reduce((s, p) => s + Number(p.supplierCost), 0);
    
    revenue += (baseRev + pkgClient - discount);
    totalDiscounts += discount;
    supplierCostsTotal += pkgSupplier;
    (e.equipmentRent || []).forEach(eq => equipmentRentTotal += Number(eq.price));
  });

  let wagesTotal = state.photographers.reduce((sum, p) => sum + getPhotographerStats(p.id, month).baseWageTotal, 0);
  let generalExpenses = state.expenses.filter(ex => ex.type === 'general' && ex.date.startsWith(month))
                                      .reduce((sum, ex) => sum + Number(ex.amount), 0);

  const netProfit = revenue - wagesTotal - equipmentRentTotal - supplierCostsTotal - generalExpenses;

  return { revenue, wagesTotal, equipmentRentTotal, supplierCostsTotal, totalDiscounts, generalExpenses, netProfit, eventsCount: events.length };
}

function renderView() {
  const container = document.getElementById('view-container');
  container.innerHTML = '';
  container.className = 'p-4 md:p-8 flex-1 animate-slide-up';

  switch(currentView) {
    case 'dashboard': renderDashboard(container); break;
    case 'events': renderEvents(container); break;
    case 'team': renderTeam(container); break;
    case 'expenses': renderExpenses(container); break;
    case 'inventory': renderInventory(container); break;
    case 'settings': renderSettings(container); break;
  }
}

         return pStats.equipmentTotal > 0 ? `<div class="flex justify-between items-center p-3 border-b border-app-border last:border-0"><div><p class="text-sm text-white font-bold">${p.name}</p></div><span class="text-purple-400 font-bold">${formatMoney(pStats.equipmentTotal)}</span></div>` : '';
     }).join('');
     summaryHtml = `<div class="grid grid-cols-1 mb-4">${createStatBox('إجمالي إيجار المعدات', formatMoney(stats.equipmentRentTotal), 'text-purple-400')}</div>`;

  } else if (type === 'supplier') {
     title = 'تحليل تكلفة الموردين والخدمات';

function showEventDetails(id) {
  const e = state.events.find(x => x.id === id);
  if(!e) return;
  const h = state.halls.find(x => x.id === e.hallId) || {name: 'موقع خارجي', id: 'external'};
  
  const monthEvents = getEventsForMonth(currentMonth);

  const photogDetails = (e.photographerIds||[]).map(pid => {
    const p = state.photographers.find(x => x.id === pid) || {name: 'غير معروف', wage: 0};

    const pEq = (e.equipmentRent||[]).filter(eq => eq.pId === pid).reduce((sum, eq) => sum + Number(eq.price), 0);
    const pBonus = (e.bonuses||[]).filter(b => b.pId === pid).reduce((sum, b) => sum + Number(b.amount), 0);
    const pTotal = pWage + pEq + pBonus;
    
    const pStatsMonth = getPhotographerStats(pid, currentMonth);

    return { ...p, pWage, pEq, pBonus, pTotal, monthDays: pStatsMonth.days, monthTotal: pStatsMonth.totalEarned };
  });

  const eqTotal = (e.equipmentRent||[]).reduce((sum, eq) => sum + Number(eq.price), 0);

            <div class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-primary-500/30 transition-colors">
              <p class="text-[10px] text-app-muted mb-1">الإيراد النهائي (الأساسي + الباقات - الخصم)</p>
              <p class="font-bold text-white text-lg">${formatMoney(finalRevenue)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-amber-500/30 transition-colors">
              <p class="text-[10px] text-app-muted mb-1">إجمالي أجور الطاقم</p>
              <p class="font-bold text-amber-400">${formatMoney(totalWages)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-purple-500/30 transition-colors">
              <p class="text-[10px] text-app-muted mb-1">تكلفة المعدات المؤجرة</p>
              <p class="font-bold text-purple-400">${formatMoney(eqTotal)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-pink-500/30 transition-colors">
              <p class="text-[10px] text-app-muted mb-1">تكلفة خدمات الموردين</p>
              <p class="font-bold text-pink-400">${formatMoney(pkgSupplierTotal)}</p>
            </div>
            <div class="bg-app-surface border border-app-border p-3 rounded-xl hover:border-red-500/30 transition-colors">
              <p class="text-[10px] text-app-muted mb-1">خصم إضافي للعميل</p>
              <p class="font-bold text-red-400">${formatMoney(discount)}</p>
            </div>
            <div class="bg-primary-500/10 border border-primary-500/30 p-3 rounded-xl shadow-inner relative overflow-hidden">
              <div class="absolute right-0 top-0 w-16 h-16 bg-primary-500/20 blur-xl rounded-full"></div>
              <p class="text-[10px] text-primary-400 mb-1 relative z-10">الربح الصافي للاستوديو</p>
              <p class="font-bold text-xl text-emerald-400 relative z-10">${formatMoney(netProfit)}</p>
            </div>
         </div>
         
         ${(e.packages && e.packages.length > 0) ? `
         <div class="mt-4 bg-app-bg border border-app-border rounded-xl p-4">
           <p class="text-xs font-bold text-white mb-3">الخدمات الخارجية والباقات المضافة:</p>
           ${e.packages.map(p => `
             <div class="flex flex-col sm:flex-row justify-between sm:items-center text-xs mb-2 last:mb-0 border-b border-app-border/50 pb-2 last:border-0 last:pb-0 gap-2">

}

function sendWAInvoice(id) {
  const e = state.events.find(x => x.id === id);
  const h = state.halls.find(x => x.id === e.hallId) || {name: ''};
  
  let msg = `✨ *${state.settings.companyName || 'الاستوديو'}* ✨\n`;
  msg += `ــــــــــــــــــــــــــــــــــــــــ\n\n`;
  msg += `🧾 *فاتورة ${e.type === 'event' ? 'حجز مناسبة' : 'عمل'}*\n\n`;
  
  msg += `📅 *التاريخ:* ${formatDateAr(e.date)}\n`;
  msg += `🏛️ *المكان:* ${h.name}\n`;
  if (e.clientName) msg += `👤 *العميل:* ${e.clientName}\n`;
  if (e.address) msg += `📍 *العنوان:* ${e.address}\n`;
  
  msg += `\nــــــــــــــــــــــــــــــــــــــــ\n`;
  msg += `💰 *الإيراد الأساسي:* ${formatMoney(e.revenue)}\n`;
  if (e.packages && e.packages.length > 0) {
      msg += `✨ *الخدمات الإضافية الملحقة:*\n`;
      e.packages.forEach(p => {
          const detailStr = p.details ? ` (${p.details})` : '';
          msg += ` - ${p.name} x${p.qty || 1}${detailStr} (${formatMoney(p.clientPrice)})\n`;
      });
  }
  if (e.discount && Number(e.discount) > 0) {
      msg += `🔻 *خصم إضافي:* ${formatMoney(e.discount)}\n`;
  }
  const finalTotal = Number(e.revenue || 0) + (e.packages || []).reduce((s, p) => s + Number(p.clientPrice), 0) - Number(e.discount || 0);
  msg += `ــــــــــــــــــــــــــــــــــــــــ\n`;
  msg += `💵 *الإجمالي النهائي المطلوب:* ${formatMoney(finalTotal)}\n`;
  msg += `ــــــــــــــــــــــــــــــــــــــــ\n\n`;
  msg += `نسعد دائماً بخدمتكم 🎥🤍`;

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function getPhotogOptionsHtml(selectedId = '') {
  return `<option value="">اختر الفرد</option>` + state.photographers.map(p => `<option value="${p.id}" ${p.id===selectedId?'selected':''}>${p.name}</option>`).join('');

function addPkgRow(pkgId = '', qty = 1, details = '') {
  const container = document.getElementById('ev_pkg_rows');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'flex flex-col md:flex-row gap-2 bg-app-bg p-2 rounded-lg border border-app-border pkg-row';
  const options = `<option value="">-- اختر الخدمة --</option>` + state.supplierPackages.map(p => `<option value="${p.id}" ${p.id === pkgId ? 'selected' : ''}>${p.name} ${p.supplierName ? `(${p.supplierName})` : ''}</option>`).join('');

  div.innerHTML = `
    <select class="pkg-select flex-1 rounded-lg text-sm p-2 outline-none border border-app-border bg-app-surface text-white">${options}</select>
    <input type="number" class="pkg-qty w-full md:w-20 rounded-lg text-sm p-2 outline-none border border-app-border bg-app-surface text-white" placeholder="الكمية" value="${qty}" min="1">
    <input type="text" class="pkg-details flex-1 rounded-lg text-sm p-2 outline-none border border-app-border bg-app-surface text-white" placeholder="تفاصيل (مثل: مقاس 3x4)" value="${details}">
    <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 font-bold px-3 py-2 bg-red-500/10 rounded-lg shrink-0">✕</button>
  `;
  container.appendChild(div);

function saveEvent() {
  const id = document.getElementById('ev_id').value || generateId();
  const type = document.getElementById('ev_type').value;
  const isEvent = type === 'event';
  const date = document.getElementById('ev_date').value;
  
  const hallId = (!isEvent && document.getElementById('ev_hall')) ? document.getElementById('ev_hall').value : '';
  const revenue = document.getElementById('ev_revenue').value;
  
  if(!date || !revenue) { showToast('الرجاء إكمال البيانات الأساسية', 'error'); return; }
  if(!isEvent && !hallId) { showToast('الرجاء اختيار القاعة لليومية', 'error'); return; }

  let selectedPackages = [];
  if (isEvent) {
      selectedPackages = Array.from(document.querySelectorAll('.pkg-row')).map(r => {
          const pkgId = r.querySelector('.pkg-select').value;
          const qty = Number(r.querySelector('.pkg-qty').value) || 1;
          const details = r.querySelector('.pkg-details').value;
          if (!pkgId) return null;
          const pkg = state.supplierPackages.find(p => p.id === pkgId);
          if (!pkg) return null;
          return {
              id: pkg.id, name: pkg.name, qty: qty, details: details,
              clientPrice: pkg.clientPrice * qty,
              supplierCost: pkg.supplierCost * qty
          };
      }).filter(Boolean);
  }

  const evData = {
    id, type,
    date, hallId, revenue: Number(revenue),
    discount: isEvent ? Number(document.getElementById('ev_discount')?.value || 0) : 0,
    clientName: isEvent ? (document.getElementById('ev_clientName')?.value || '') : '',
    clientPhone: isEvent ? (document.getElementById('ev_clientPhone')?.value || '') : '',
    address: isEvent ? (document.getElementById('ev_address')?.value || '') : '',
    photographerIds: Array.from(document.querySelectorAll('input[name="ev_photogs"]:checked')).map(cb => cb.value),
    packages: selectedPackages,
    equipmentRent: Array.from(document.querySelectorAll('.eq-row')).map(r => ({
      pId: r.querySelector('.eq-pid').value, name: r.querySelector('.eq-name').value, price: Number(r.querySelector('.eq-price').value || 0)
    })).filter(x => x.pId && x.name)
  };

  const idx = state.events.findIndex(e => e.id === id);
  if(idx >= 0) state.events[idx] = evData; else state.events.push(evData);

  saveData(); closeModal(); renderView(); showToast('تم حفظ العملية بنجاح');
}

function updatePayoutBalance(pId) {
  const info = document.getElementById('pay_balance_info');
  if(!pId) { info.classList.add('hidden'); return; }
  
  const allTimeStats = getAllTimePhotographerStats(pId);
  
  document.getElementById('pay_balance_val').textContent = formatMoney(allTimeStats.overallRemaining);
  document.getElementById('pay_amount').value = allTimeStats.overallRemaining > 0 ? allTimeStats.overallRemaining : '';
  info.classList.remove('hidden');
}

function savePayout() {
  const pId = document.getElementById('pay_pid').value;
  const amount = Number(document.getElementById('pay_amount').value);
  const date = document.getElementById('pay_date').value;
  if(!pId || amount <= 0 || !date) return showToast('بيانات غير صحيحة', 'error');
  state.expenses.push({ id: generateId(), type: 'payout', pId, amount, date, desc: document.getElementById('pay_desc').value });

function savePackage() {
  const id = document.getElementById('pkg_id').value || generateId();
  const name = document.getElementById('pkg_name').value;
  const supplierName = document.getElementById('pkg_supplierName').value;
  const clientPrice = Number(document.getElementById('pkg_clientPrice').value);
  const supplierCost = Number(document.getElementById('pkg_supplierCost').value);
  
  if(!name || clientPrice < 0 || supplierCost < 0) return showToast('بيانات الخدمة غير مكتملة', 'error');
  
  const pkgData = { id, name, supplierName, clientPrice, supplierCost };
  const idx = state.supplierPackages.findIndex(p => p.id === id);
  if (idx >= 0) state.supplierPackages[idx] = pkgData;
  else state.supplierPackages.push(pkgData);
  
  saveData(); closeModal(); renderSettings(document.getElementById('view-container')); showToast('تم الحفظ بنجاح');
}

function deletePackage(id) {
  state.supplierPackages = state.supplierPackages.filter(p => p.id !== id);
  saveData(); renderSettings(document.getElementById('view-container')); showToast('تم الحذف');
}

function copyPortalLink(url) {
  const tempInput = document.createElement("input"); tempInput.value = url;
  document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
  showToast('تم نسخ رابط البوابة بنجاح');
}

function processTemplate(template, data) {
  return template.replace(/{name}/g, data.name || '')
                 .replace(/{company}/g, data.company || '')
                 .replace(/{url}/g, data.url || '');
}

function openQuickMsgModal(pId) {

  const company = state.settings.companyName || 'الاستوديو';
  const baseUrl = window.location.href.split('?')[0];

  const templateData = { name: p.name, company: company, url: portalUrl };

function renderPortalView() {
  const container = document.getElementById('view-container');
  const p = state.photographers.find(x => x.id === portalPhotographerId);
  const statsMonth = getPhotographerStats(portalPhotographerId, currentMonth);
  const statsAllTime = getAllTimePhotographerStats(portalPhotographerId);
  
  let log = [];
  statsMonth.events.forEach(e => {
      const h = state.halls.find(x => x.id === e.hallId) || {name: 'موقع خارجي'};
      const addressText = e.address ? ` - ${e.address}` : '';
      log.push({ date: e.date, type: 'work', title: 'عملية إنتاجية', desc: `${h.name}${addressText}`, amount: Number(p.wage) });
      (e.equipmentRent || []).filter(eq => eq.pId === p.id).forEach(eq => { log.push({ date: e.date, type: 'equip', title: 'إعارة معدة', desc: eq.name, amount: Number(eq.price) }); });
      (e.bonuses || []).filter(b => b.pId === p.id).forEach(b => { log.push({ date: e.date, type: 'bonus', title: 'مكافأة / بدل', desc: b.reason, amount: Number(b.amount) }); });
  });
  state.expenses.filter(ex => ex.type === 'payout' && ex.pId === p.id && ex.date.startsWith(currentMonth)).forEach(ex => {
      log.push({ date: ex.date, type: 'payout', title: 'سحب رصيد', desc: ex.desc || 'دفعة مستلمة', amount: -Number(ex.amount) });
  });
  log.sort((a,b) => b.date.localeCompare(a.date));

  container.innerHTML = `
    <div class="max-w-md mx-auto pt-4 pb-12 animate-fade-in">
      
      <!-- Date Filter -->
      <div class="flex justify-center mb-6">
        <div class="flex items-center bg-app-surface border border-app-border rounded-xl p-1 shadow-sm">
          <button onclick="shiftMonth(-1)" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted transition-colors">&lt;</button>
          <input type="month" id="global-month" onchange="onMonthChange(this.value)" class="bg-transparent border-none text-sm font-bold text-white outline-none px-4 text-center cursor-pointer !shadow-none !border-transparent">
          <button onclick="shiftMonth(1)" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-app-hover text-app-muted transition-colors">&gt;</button>
        </div>
      </div>

      <!-- Wallet Card (Shows All-Time Remaining Balance) -->
      <div class="bg-gradient-to-br from-primary-600 to-accent-600 rounded-3xl p-6 relative overflow-hidden shadow-neon mb-6">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-black opacity-10 rounded-full blur-xl transform -translate-x-1/2 translate-y-1/2"></div>
        
        <div class="flex items-center gap-3 mb-6 relative z-10">
          <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-white font-bold text-xl backdrop-blur-sm border border-white/30 shadow-inner">${getInitials(p.name)}</div>
          <div>
            <h2 class="font-bold text-lg text-white">${p.name}</h2>
            <p class="text-white/80 text-xs font-medium tracking-wide">كشف الحساب المالي المباشر</p>
          </div>
        </div>
        
        <div class="relative z-10 text-center py-2">
          <p class="text-white/80 text-xs font-medium mb-1">الرصيد الكلي المتبقي لك (حتى الآن)</p>
          <h3 class="text-white font-bold text-5xl tracking-tight drop-shadow-md">${formatMoney(statsAllTime.overallRemaining)}</h3>
        </div>
      </div>

      <!-- Detailed Breakdown Box (For the selected month) -->
      <h3 class="font-bold text-sm text-app-muted mb-3 px-2 uppercase tracking-wide">ملخص أرباح شهر ${formatDateAr(currentMonth+'-01').substring(3)}</h3>
      <div class="grid grid-cols-2 gap-3 mb-8">
        <div class="bg-app-surface border border-app-border rounded-2xl p-4 shadow-sm hover:border-primary-500/30 transition-colors">
          <div class="flex justify-between items-start mb-2"><span class="text-xl">📅</span><span class="text-[10px] font-bold text-primary-400 bg-primary-500/10 px-2 py-1 rounded-md border border-primary-500/20">${statsMonth.days} أيام عمل</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-0.5">أجور العمل الأساسية</p>
          <p class="text-sm font-bold text-white">${formatMoney(statsMonth.baseWageTotal)}</p>
        </div>
        <div class="bg-app-surface border border-app-border rounded-2xl p-4 shadow-sm hover:border-purple-500/30 transition-colors">
          <div class="flex justify-between items-start mb-2"><span class="text-xl">📷</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-0.5">عوائد إيجار معداتك</p>
          <p class="text-sm font-bold text-purple-400">${formatMoney(statsMonth.equipmentTotal)}</p>
        </div>
        <div class="bg-app-surface border border-app-border rounded-2xl p-4 shadow-sm hover:border-pink-500/30 transition-colors">
          <div class="flex justify-between items-start mb-2"><span class="text-xl">🎁</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-0.5">مكافآت وبدلات</p>
          <p class="text-sm font-bold text-pink-400">${formatMoney(statsMonth.bonusesTotal)}</p>
        </div>
        <div class="bg-app-surface border border-app-border rounded-2xl p-4 shadow-sm hover:border-red-500/30 transition-colors">
          <div class="flex justify-between items-start mb-2"><span class="text-xl">💸</span></div>
          <p class="text-[10px] text-app-muted font-bold mb-0.5">دفعات مالية استلمتها</p>
          <p class="text-sm font-bold text-red-400">${formatMoney(statsMonth.payoutsThisMonth)}</p>
        </div>
      </div>

      <!-- Transaction Log -->
      <h3 class="font-bold text-sm text-app-muted mb-3 px-2 uppercase tracking-wide">سجل الحركات للشهر المحدد</h3>
      <div class="space-y-3">
        ${log.length === 0 ? '<div class="text-center bg-app-surface border border-dashed border-app-border rounded-2xl p-8 text-app-muted text-sm font-medium">لا توجد حركات مسجلة هذا الشهر.</div>' : ''}
        ${log.map(item => `
          <div class="bg-app-surface border border-app-border rounded-2xl p-4 flex items-center justify-between hover:border-primary-500/40 transition-all hover:shadow-md hover:-translate-y-0.5">
            <div class="flex gap-3 items-center">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-sm border border-app-border ${item.type === 'payout' ? 'bg-red-500/10 text-red-400' : (item.type==='equip'?'bg-purple-500/10 text-purple-400' : (item.type==='bonus'?'bg-pink-500/10 text-pink-400' : 'bg-primary-500/10 text-primary-400'))}">
                ${item.type === 'work' ? '🎬' : (item.type === 'payout' ? '📉' : (item.type === 'equip' ? '📷' : '🎁'))}
              </div>
              <div>
                <h4 class="font-bold text-white text-sm mb-0.5">${item.title}</h4>
                <p class="text-[10px] text-app-muted">${formatDateAr(item.date)} • ${item.desc}</p>
              </div>
            </div>
            <div class="font-bold text-base whitespace-nowrap bg-app-bg px-3 py-1.5 rounded-lg border border-app-border shadow-inner ${item.amount > 0 ? 'text-emerald-400' : 'text-red-400'}">
              ${item.amount > 0 ? '+' : ''}${formatMoney(item.amount)}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Start app
window.onload = initApp;
</script>
</body>
</html>
